      "Représentants Légaux",

    const LBC_STEP   = "Interlocuteurs LBC-FT et Qualité";
    const ADMIN_STEP = "Administrateurs/membres du directoire/membres du conseil de surveillance";
    const ADMIN_FORMES = ['SELAS', 'SELASU', 'SELAFA', 'SELCA'];

    const buildSteps = (hasPM, profile, formeJuridique) => {
      const steps = [...BASE_STEPS];
      const hasAdmin = ADMIN_FORMES.includes(formeJuridique);

      // EXTRA_STEP après "Représentants Légaux"
      if (hasPM) {
        const rlIdx = steps.indexOf("Représentants Légaux");
        if (rlIdx !== -1) steps.splice(rlIdx + 1, 0, EXTRA_STEP);
      }

      // LBC_STEP après "Personne de contact principal"
      if (profile === 'SEC' || profile === 'SPE') {
        const pcpIdx = steps.indexOf("Personne de contact principal");
        if (pcpIdx !== -1) steps.splice(pcpIdx + 1, 0, LBC_STEP);
      }

      // ADMIN_STEP après LBC_STEP (si présent) ou après "Personne de contact principal"
      if (hasAdmin) {
        const lbcIdx = steps.indexOf(LBC_STEP);
        const pcpIdx = steps.indexOf("Personne de contact principal");
        const insertAfter = lbcIdx !== -1 ? lbcIdx : pcpIdx;
        if (insertAfter !== -1) steps.splice(insertAfter + 1, 0, ADMIN_STEP);
      }

      return steps;
    };

          const isActive = stepNum === currentStep;
          const isCompleted = stepNum < currentStep;
          const isLast = idx === steps.length - 1;

          return (
            <div key={idx} style={{ display: 'flex', flexDirection: 'row' }}>
              {/* Left: circle + connector line stacked in flex-column */}

                  height: '24px',

    // ============================================================
    // STEP 2: DATES DE SESSIONS
    // ============================================================
    const CalendarIcon = () => (
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0 }}>
        <path d="M5.333 1.333v1.334M10.667 1.333v1.334M2 6.667h12M3.333 2.667h9.334c.736 0 1.333.597 1.333 1.333v9.333c0 .737-.597 1.334-1.333 1.334H3.333A1.333 1.333 0 0 1 2 13.333V4c0-.736.597-1.333 1.333-1.333z" stroke={T.color.gray} strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    );

    // ── DatePicker component (calendar popup) ──
    const DatePicker = ({ value, onChange, placeholder = "Sélectionnez une date" }) => {
      const [open, setOpen] = useState(false);
      const [yearPickerOpen, setYearPickerOpen] = useState(false);
      const today = new Date();
      const [viewYear, setViewYear] = useState(today.getFullYear());
      const [viewMonth, setViewMonth] = useState(today.getMonth());
      const yearListRef = React.useRef(null);

      const JOURS = ['lu', 'ma', 'me', 'je', 've', 'sa', 'di'];
      const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      // Monday-based: 0=Mon … 6=Sun
      const firstDayRaw = new Date(viewYear, viewMonth, 1).getDay();
      const startDay = firstDayRaw === 0 ? 6 : firstDayRaw - 1;

      const prevMonth = () => {
        if (viewMonth === 0) { setViewMonth(11); setViewYear(viewYear - 1); }
        else setViewMonth(viewMonth - 1);
      };
      const nextMonth = () => {
        if (viewMonth === 11) { setViewMonth(0); setViewYear(viewYear + 1); }
        else setViewMonth(viewMonth + 1);
      };

      const selectDay = (day) => {
        const dd = String(day).padStart(2, '0');
        const mm = String(viewMonth + 1).padStart(2, '0');
        onChange(`${dd}/${mm}/${viewYear}`);
        setOpen(false);
      };

      const isToday = (day) => {
        return day === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear();
      };

      // Parse selected date to highlight
      const selectedParts = (value || '').split('/');
      const isSelected = (day) => {
        if (selectedParts.length !== 3) return false;
        return parseInt(selectedParts[0]) === day && parseInt(selectedParts[1]) === viewMonth + 1 && parseInt(selectedParts[2]) === viewYear;
      };

      // Build grid cells: leading blanks + days + trailing
      const cells = [];
      for (let i = 0; i < startDay; i++) {
        // Previous month's trailing days
        const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
        cells.push({ day: prevMonthDays - startDay + 1 + i, current: false });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ day: d, current: true });
      }
      const remaining = 42 - cells.length;
      for (let i = 1; i <= remaining; i++) {
        cells.push({ day: i, current: false });
      }

      return (
        <div style={{ position: 'relative' }}>
          {/* Input field */}
          <div
            onClick={() => setOpen(!open)}
            style={{
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              height: '40px', border: `1px solid ${T.color.border}`, borderRadius: T.radius,
              padding: '0 14px', background: T.color.white, cursor: 'pointer',
            }}

            <span style={{ fontSize: '14px', color: value ? T.color.textDark : T.color.gray, fontFamily: T.font }}>
              {value || placeholder}
            </span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0 }}>

            </svg>
          </div>

          {/* Calendar popup */}
          {open && (
            <div style={{
              position: 'absolute', bottom: '46px', left: 0, zIndex: 50,
              background: T.color.white, border: `1px solid ${T.color.border}`,
              borderRadius: T.radius, boxShadow: T.shadow.card,
              padding: '16px', width: '300px',
            }}>
              {/* Header: < month year > */}
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px' }}>
                <button onClick={() => { if (yearPickerOpen) { setYearPickerOpen(false); } prevMonth(); }} style={{
                  background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px',
                  color: T.color.gray, padding: '4px 8px', fontFamily: T.font,
                }}>&lt;</button>
                <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                  <span style={{ fontSize: '14px', fontWeight: 600, color: T.color.textDark }}>
                    {MOIS[viewMonth]}
                  </span>
                  <span
                    onClick={() => setYearPickerOpen(!yearPickerOpen)}
                    style={{
                      fontSize: '14px', fontWeight: 600, color: T.color.primaryBlue,
                      cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: '2px',
                    }}
                  >
                    {viewYear}
                  </span>
                </div>
                <button onClick={() => { if (yearPickerOpen) { setYearPickerOpen(false); } nextMonth(); }} style={{
                  background: 'none', border: 'none', cursor: 'pointer', fontSize: '16px',
                  color: T.color.gray, padding: '4px 8px', fontFamily: T.font,
                }}>&gt;</button>
              </div>

              {/* Year picker grid */}
              {yearPickerOpen && (
                <div ref={yearListRef} style={{
                  display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '6px',
                  marginBottom: '12px', maxHeight: '180px', overflowY: 'auto',
                  padding: '4px',
                }}>
                  {Array.from({ length: 30 }, (_, i) => today.getFullYear() - 25 + i).map(y => (
                    <div
                      key={y}
                      onClick={() => { setViewYear(y); setYearPickerOpen(false); }}
                      style={{
                        textAlign: 'center', padding: '8px 4px', fontSize: '13px',
                        fontFamily: T.font, cursor: 'pointer', borderRadius: T.radius,
                        fontWeight: y === viewYear ? 700 : 400,
                        color: y === viewYear ? T.color.white : T.color.textDark,
                        background: y === viewYear ? T.color.primaryBlue : 'transparent',
                        transition: 'background 0.1s',
                      }}
                      onMouseEnter={e => { if (y !== viewYear) e.currentTarget.style.background = T.color.radioBg; }}
                      onMouseLeave={e => { if (y !== viewYear) e.currentTarget.style.background = 'transparent'; }}
                    >
                      {y}
                    </div>
                  ))}
                </div>
              )}

              {/* Day headers */}
              {!yearPickerOpen && (
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', marginBottom: '4px' }}>
                {JOURS.map(j => (
                  <div key={j} style={{ textAlign: 'center', fontSize: '12px', fontWeight: 500, color: T.color.gray, padding: '4px 0' }}>
                    {j}
                  </div>
                ))}
              </div>
              )}

              {/* Day cells */}
              {!yearPickerOpen && (
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px' }}>
                {cells.map((c, idx) => {
                  const sel = c.current && isSelected(c.day);
                  const tod = c.current && isToday(c.day);
                  return (
                    <div
                      key={idx}
                      onClick={c.current ? () => selectDay(c.day) : undefined}
                      style={{
                        textAlign: 'center', fontSize: '13px', padding: '6px 0',
                        cursor: c.current ? 'pointer' : 'default',
                        color: !c.current ? '#C6D1E2' : sel ? T.color.white : T.color.textDark,
                        background: sel ? T.color.primaryBlue : 'transparent',
                        borderRadius: '50%',
                        width: '32px', height: '32px',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        margin: '0 auto',
                        fontWeight: tod && !sel ? 600 : 400,
                        border: tod && !sel ? `2px solid ${T.color.primaryBlue}` : 'none',
                        transition: 'all 0.1s',
                      }}
                    >
                      {c.day}
                    </div>
                  );
                })}
              </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const Step2Content = ({ croec }) => {

      const parseDate = (str) => {
        if (!str) return null;

        return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
      };

      // Validation logic
      const getDateError = () => {
        if (!dateUlterieure) return null;
        const chosen = parseDate(dateUlterieure);
        if (!chosen) return null;
        const today = new Date(); today.setHours(0,0,0,0);
        const maxDate = new Date(today); maxDate.setMonth(maxDate.getMonth() + 6);
        // RG9: max 6 months
        if (chosen > maxDate) return "Vérifier l'information renseignée.";
        if (noDates) {
          // RG8: no sessions → date must be strictly after today
          if (chosen <= today) return "Vérifier l'information renseignée.";
        } else {
          // RG7: date must be strictly after next session date
          const nextSession = SESSIONS_DATA[0].date;
          if (chosen <= nextSession) return "Vérifier l'information renseignée.";

            {noDates ? (

              </p>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '16px' }}>
                {SESSIONS_DATA.map((s, idx) => (
                  <div key={idx} style={{

                    {dateError}

    const CapitalSocialCard = ({ data, update }) => {
      const d = data || {};
      const errStyle = { fontSize: '13px', color: '#C81E1E', margin: '4px 0 0 0', lineHeight: '18px' };

      // Helpers
      const isInteger = (v) => /^\d+$/.test(v);
      const isDecimal2 = (v) => /^\d+([.,]\d{1,2})?$/.test(v);
      const parseNum = (v) => parseFloat((v || '').replace(',', '.')) || 0;

      // Per-field errors (only show if field has a value)
      const montant = d.capitalMontant || '';
      const titres = d.capitalTitres || '';

      const errMsg = 'Vérifiez l\'information saisie.';
      const errMontant = montant && !isInteger(montant) ? errMsg : '';
      const errTitres = titres && !isInteger(titres) ? errMsg : '';
      const errValeur = valeur && !isDecimal2(valeur) ? errMsg : '';
      const errVoix = voix && !isInteger(voix) ? errMsg : '';

      // Cross-field: Nb titres × Valeur nominale == Montant
      const crossCheck = titres && valeur && montant && !errMontant && !errTitres && !errValeur;
      const calcul = crossCheck ? parseNum(titres) * parseNum(valeur) : null;
      const montantNum = crossCheck ? parseNum(montant) : null;
      const errCross = crossCheck && Math.abs(calcul - montantNum) > 0.01
        ? `Incohérence : Nombre de titres (${titres}) × Valeur nominale (${valeur}) = ${calcul.toFixed(2)} €, mais le montant saisi est ${montant} €.`
        : '';

              borderRadius: T.radius,
            }}>
              <p style={{ fontSize: '13px', color: '#991B1B', margin: 0, lineHeight: '18px' }}>{errCross}</p>
            </div>
          )}
        </SectionCard>
      );

    // ── Reusable Address Block ──
    const AddressBlock = ({ data, onChange, prefix, noRequired }) => {
      const pfx = (k) => prefix ? `${prefix}${k.charAt(0).toUpperCase()}${k.slice(1)}` : k;
      const val = (k) => data[pfx(k)] || '';
      const set = (k, v) => onChange(pfx(k), v);
      const req = !noRequired;

      const [addrQuery, setAddrQuery] = React.useState('');
      const [addrOpen, setAddrOpen] = React.useState(false);
      const [addrResults, setAddrResults] = React.useState([]);
      const addrRef = React.useRef(null);

      React.useEffect(() => {
        const handler = (e) => { if (addrRef.current && !addrRef.current.contains(e.target)) setAddrOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const handleAddrSearch = (q) => {
        setAddrQuery(q);
        if (q.length < 1) { setAddrResults([]); setAddrOpen(false); return; }
        const lower = q.toLowerCase();
        const filtered = MOCK_ADRESSES.filter(a => a.label.toLowerCase().includes(lower));
        setAddrResults(filtered);
        setAddrOpen(filtered.length > 0);
      };

      const selectAddr = (addr) => {
        set('rue', addr.rue);
        set('codePostal', addr.codePostal);
        set('ville', addr.ville);
        set('pays', addr.pays);
        setAddrQuery(addr.label);
        setAddrOpen(false);
      };

      return (
        <>
          <div style={{ marginBottom: '16px', position: 'relative' }} ref={addrRef}>
            <label style={{ display: 'block', fontSize: '14px', fontWeight: 500, marginBottom: '6px', color: T.color.textDark }}>
              Recherche adresse
            </label>
            <input
              value={addrQuery}
              onChange={e => handleAddrSearch(e.target.value)}
              onFocus={() => { if (addrResults.length > 0) setAddrOpen(true); }}
              placeholder="Saisissez une adresse..."
              style={{
                width: '100%', height: '40px', border: `1px solid ${T.color.border}`, borderRadius: T.radius,
                padding: '0 14px', fontSize: '14px', color: T.color.textDark, fontFamily: T.font,
                background: T.color.white, outline: 'none',
              }}
            />
            {addrOpen && addrResults.length > 0 && (
              <div style={{
                position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 1000,
                background: T.color.white, border: `1px solid ${T.color.border}`, borderRadius: T.radius,
                boxShadow: T.shadow, maxHeight: '220px', overflowY: 'auto',
              }}>
                {addrResults.map((addr, i) => (
                  <div
                    key={i}
                    onClick={() => selectAddr(addr)}
                    style={{
                      padding: '10px 14px', cursor: 'pointer', fontSize: '14px',
                      color: T.color.textDark, borderBottom: i < addrResults.length - 1 ? `1px solid ${T.color.bgLight}` : 'none',
                    }}
                    onMouseEnter={e => e.currentTarget.style.background = T.color.bgLight}
                    onMouseLeave={e => e.currentTarget.style.background = T.color.white}
                  >
                    {addr.label}
                  </div>
                ))}
              </div>
            )}

            <FieldInput label="Rue" required={req} value={val('rue')} onChange={v => set('rue', v)} />
          </div>
          <div style={{ marginBottom: '16px' }}>
            <FieldInput label="Complément d'adresse" value={val('complement')} onChange={v => set('complement', v)} />
          </div>
          <div style={{ marginBottom: '16px' }}>
            <FieldInput label="Lieu-dit" value={val('lieuDit')} onChange={v => set('lieuDit', v)} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
            <FieldInput label="Code postal" required={req} value={val('codePostal')} onChange={v => set('codePostal', v)} />

            <FieldSelect label="Pays" required={req} value={val('pays')} onChange={v => set('pays', v)} options={PAYS_OPTIONS} placeholder="Sélectionnez" />

      { civilite: 'Monsieur', nom: 'BERTRAND', prenom: 'Alain', prenom2: 'François', prenom3: '', prenom4: '', region: 'PACA', conseilRegional: "Provence-Alpes-Côte d'Azur" },

    );

    // ── Person Search Autocomplete ──
    const PersonSearchAutocomplete = ({ onSelectPerson, onManual, onClear, searchMode, selectedLabel }) => {
      const [query, setQuery] = useState('');
      const [focused, setFocused] = useState(false);
      const containerRef = React.useRef(null);

      React.useEffect(() => {
        const handler = (e) => {
          if (containerRef.current && !containerRef.current.contains(e.target)) {
            setFocused(false);
          }
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const filtered = query.length >= 1
        ? MOCK_PERSONNES_PP.filter(p =>
            `${p.nom} ${p.prenom}`.toLowerCase().includes(query.toLowerCase()) ||
            p.nom.toLowerCase().startsWith(query.toLowerCase())
          )
        : [];

      const showDropdown = focused && !searchMode;

      const handleSelect = (person) => {
        setQuery(`${person.civilite} ${person.nom} ${person.prenom} - ${person.region}`);
        setFocused(false);
        onSelectPerson(person);
      };

      const handleManual = () => {
        setQuery('+ Renseignez manuellement');
        setFocused(false);
        onManual();
      };

      const handleClear = () => {
        setQuery('');
        setFocused(true);
        onClear();
      };

      const handleChange = (e) => {
        const v = e.target.value;
        setQuery(v);
        if (searchMode) onClear();
      };

      return (
        <div ref={containerRef} style={{ position: 'relative', marginBottom: '16px' }}>
          <p style={{ fontSize: '14px', fontWeight: 500, color: T.color.textDark, margin: '0 0 6px 0' }}>
            <span style={{ color: '#C81E1E' }}>* </span>Recherchez la personne physique
          </p>
          <div style={{
            display: 'flex', alignItems: 'center',
            border: `1px solid ${T.color.border}`, borderRadius: T.radius,
            height: '40px', background: T.color.white, overflow: 'hidden',
          }}>
            <input
              value={searchMode ? (selectedLabel || query) : query}
              onChange={handleChange}
              onFocus={() => !searchMode && setFocused(true)}
              readOnly={!!searchMode}
              placeholder="Saisissez le NOM, Prénom, CROEC d'inscription principale"
              style={{
                flex: 1, border: 'none', outline: 'none', fontSize: '14px',
                color: T.color.textDark, background: 'transparent', fontFamily: T.font,
                padding: '0 14px', height: '100%',
              }}
            />
            {searchMode && (
              <span onClick={handleClear} style={{
                cursor: 'pointer', color: T.color.gray, fontWeight: 600,
                padding: '0 14px', fontSize: '14px',
              }}>✕</span>
            )}
          </div>

          {/* Dropdown suggestions */}
          {showDropdown && (
            <div style={{
              position: 'absolute', top: '68px', left: 0, right: 0, zIndex: 50,
              background: T.color.white, border: `1px solid ${T.color.border}`,
              borderRadius: T.radius, boxShadow: T.shadow.card, maxHeight: '240px', overflowY: 'auto',
            }}>
              {filtered.map((p, idx) => (
                <div key={idx} onClick={() => handleSelect(p)} style={{
                  padding: '10px 14px', fontSize: '14px', color: T.color.textDark,
                  cursor: 'pointer', borderBottom: `1px solid ${T.color.border}`,
                  transition: 'background 0.1s',
                }}
                onMouseEnter={e => e.currentTarget.style.background = T.color.radioBg}
                onMouseLeave={e => e.currentTarget.style.background = T.color.white}

                  {p.civilite} {p.nom} {p.prenom} - {p.region}
                </div>
              ))}
              <div onClick={handleManual} style={{
                padding: '10px 14px', fontSize: '14px', color: T.color.textDark,
                cursor: 'pointer', fontWeight: 500,
              }}
              onMouseEnter={e => e.currentTarget.style.background = T.color.radioBg}
              onMouseLeave={e => e.currentTarget.style.background = T.color.white}

              </div>
            </div>
          )}
        </div>
      );
    };

    // Dropdown for Statut
    const StatutSelect = ({ value, onChange, autreValue, onAutreChange }) => (

        <div style={{ marginBottom: value === 'Autre' ? '16px' : '16px' }}>
          <FieldSelect

            required
            value={value}
            onChange={v => { onChange(v); if (v !== 'Autre' && onAutreChange) onAutreChange(''); }}

          <div style={{ marginBottom: '16px' }}>

    const NATURE_DROITS_OPTIONS = ["Pleine propriété", "Nue-propriété", "Usufruit"];

    // Single participation row
    const ParticipationRow = ({ data, onChange, onRemove, index }) => {
      const d = data || {};
      const u = (k, v) => onChange({ ...d, [k]: v });
      return (
        <div style={{
          border: `1px solid ${T.color.border}`, borderRadius: T.radius,
          padding: '16px', marginBottom: '12px', background: T.color.white,

          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
            <span style={{ fontSize: '13px', fontWeight: 600, color: T.color.gray }}>Participation {index + 1}</span>
            {onRemove && (
              <button onClick={onRemove} style={{
                background: 'none', border: 'none', cursor: 'pointer', fontSize: '12px', color: T.color.primaryRed, fontFamily: T.font,
              }}>Supprimer</button>

          </div>
          <div style={{ marginBottom: '16px' }}>
            <FieldSelect label="Nature des droits" required value={d.natureDroits} onChange={v => u('natureDroits', v)} options={NATURE_DROITS_OPTIONS} placeholder="Sélectionnez" />
          </div>

          <div style={{ marginBottom: '16px' }}>
            <FieldInput label="Nombre de titres" required value={d.nombreTitres} onChange={v => u('nombreTitres', v)} placeholder="Saisissez un nombre entier" />

          </div>

      const exerceOui = d.exerce === 'Oui';

                    <ReadOnlyField label="Prénom" required value={d.prenom} />

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                    <ReadOnlyField label="Prénom 3" value={d.prenom3} />
                    <ReadOnlyField label="Prénom 4" value={d.prenom4} />
                  </div>
                  <div style={{ marginBottom: '16px' }}>
                    <ReadOnlyField label="Conseil régional d'inscription principale" required value={d.conseilRegional} />
                  </div>
                </>
              ) : (
                <>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                    <FieldInput label="Nom de famille" required value={d.nom} onChange={v => u('nom', v)} />
                    <FieldInput label="Prénom" required value={d.prenom} onChange={v => u('prenom', v)} />
                    <FieldInput label="Prénom 2" value={d.prenom2} onChange={v => u('prenom2', v)} />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '16px' }}>
                    <FieldInput label="Prénom 3" value={d.prenom3} onChange={v => u('prenom3', v)} />
                    <FieldInput label="Prénom 4" value={d.prenom4} onChange={v => u('prenom4', v)} />
                    <FieldSelect label="Nationalité" required value={d.nationalite} onChange={v => u('nationalite', v)} options={PAYS_OPTIONS} placeholder="Sélectionnez" />
                  </div>
                  {/* Adresse du domicile personnel */}
                  <AddressBlock data={d} onChange={(k, v) => u(k, v)} />
                </>
              )}
            </>
          )}

          {/* ── Questions always visible ── */}

          {/* Q1: exerce la profession */}
          <OuiNon
            label="Ce représentant légal exerce-t-il la profession d'expert-comptable dans un pays de l'UE ou de l'EEE (voire en Suisse - possibilité uniquement pour les SEL) ?"
            required
            value={d.exerce}
            onChange={v => u('exerce', v)}
          />

          {/* Conditional: Pays d'exercice (when exerce = Oui) */}
          {exerceOui && (
            <div style={{ marginBottom: '16px' }}>
              <FieldSelect label="Pays d'exercice" required value={d.paysExercice} onChange={v => u('paysExercice', v)} options={PAYS_EXERCICE_UE_EEE} placeholder="Sélectionnez" />

          {/* Statut (visible only when exerce question is answered) */}
          {d.exerce && (
            <StatutSelect value={d.statut} onChange={v => u('statut', v)} autreValue={d.statutAutre} onAutreChange={v => u('statutAutre', v)} />

          {/* Q2: exercera-t-il au sein */}
          <OuiNon
            label="Ce représentant légal exercera-t-il au sein de la société en cours d'inscription ?"
            required
            value={d.exerceAuSein}
            onChange={v => u('exerceAuSein', v)}
          />

          <OuiNon
            label="Ce représentant légal est-il ou sera t-il associé au sein de la société en cours d'inscription ?"

            onChange={v => u('associe', v)}

          {associeOui && (
            <>
              <ParticipationSection

                onAdd={() => u('participations', [...participations, {}])}
                onUpdate={(idx, newData) => {

                onRemove={idx => {

      "Il est en cours d'inscription au Tableau de l'ordre des experts-comptables",

      const d = data || {};

        const next = !declareAdminsPP;
        u('declareAdminsPP', next);

        u('declareAdminsPM', next);
        if (next && adminsPM.length === 0) u('adminsPM', [{ id: Date.now() }]);

      // appelle u() plusieurs fois en séquence (chaque appel lit la dernière version du state)
      const updateAdmin = (idx, key, val) => {
        u('adminsPP', prev => (prev || []).map((a, i) => i === idx ? { ...a, [key]: val } : a));
      };
      const addAdmin = () => { u('adminsPP', prev => [...(prev || []), { id: Date.now() }]); };
      const removeAdmin = (idx) => {
        u('adminsPP', prev => {
          const next = (prev || []).filter((_, i) => i !== idx);
          return next.length > 0 ? next : [{ id: Date.now() }];
        });

        u('adminsPM', prev => (prev || []).map((a, i) => i === idx ? { ...a, [key]: val } : a));
      };
      const addAdminPM = () => { u('adminsPM', prev => [...(prev || []), { id: Date.now() }]); };
      const removeAdminPM = (idx) => {

                const selected = hasAdmins === val;
                return (

                    {declareAdminsPM && (
                      <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
                        <path d="M1 4L4 7L10 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                      </svg>

                  </div>
                  <span style={{ fontSize: '14px', color: T.color.textDark, lineHeight: 1.5 }}>
                    Personne(s) <strong>morale(s)</strong>
                  </span>
                </label>
              </div>

                  padding: '6px 16px', fontSize: '14px', color: T.color.primaryBlue,
                  cursor: 'pointer', fontFamily: T.font, fontWeight: 500,
                }}>Ajouter</button>
              </div>
              <p style={{ fontSize: '14px', color: T.color.gray, margin: '0 0 16px 0' }}>
                Complétez les informations pour chaque société
              </p>
              {adminsPM.map((admin, idx) => (
                <AdminPMCard
                  key={admin.id || idx}
                  data={admin}
                  idx={idx}
                  canRemove={adminsPM.length > 1}
                  onUpdate={(k, v) => updateAdminPM(idx, k, v)}
                  onRemove={() => removeAdminPM(idx)}
                />
              ))}
            </div>
          )}
        </div>
      );
    };

    // ============================================================
    // ============================================================
    // Step: Interlocuteurs LBC-FT et Qualité (SEC / SPE uniquement)
    // ============================================================
    // PP mock list for interlocuteur dropdowns (in production: derived from actual step data)
    const PREV_PP_LIST = [
      { key: 'pp1', label: 'Mme DUBOIS Maud', prenom: 'Maud', nom: 'DUBOIS' },
      { key: 'pp2', label: 'M. DUPONT Jean',  prenom: 'Jean', nom: 'DUPONT' },
      { key: 'pp3', label: 'Mme DURAND Marie', prenom: 'Marie', nom: 'DURAND' },
      { key: 'pp4', label: 'M. MARTIN Pierre', prenom: 'Pierre', nom: 'MARTIN' },
    ];
    const AUTRE_PP = "Une autre personne que celles proposées";

    // ── 4 fonctions avec criticité ──
    const LBC_FUNCTIONS = [
      { id: 'lbcMembre',      label: 'Membre de la direction en charge de la conformité LBC-FT',               required: true,  section: 'LBC-FT'  },
      { id: 'lbcResponsable', label: 'Responsable de la conformité LBC-FT',                                     required: false, section: 'LBC-FT'  },
      { id: 'qualMembre',     label: 'Membre de la direction en charge du système de management de la qualité',  required: true,  section: 'Qualité' },
      { id: 'qualResponsable',label: 'Responsable du système de management de la qualité',                       required: false, section: 'Qualité' },
    ];

    // ── Badge criticité ──
    const FunctionBadge = ({ required }) => (
      <span style={{
        display: 'inline-flex', alignItems: 'center',
        fontSize: '11px', fontWeight: 600, padding: '2px 8px',
        borderRadius: '20px', letterSpacing: '0.02em',
        background: required ? '#FEF2F2' : '#F0F9FF',
        color:      required ? '#DC2626'  : '#0369A1',
        border:     `1px solid ${required ? '#FECACA' : '#BAE6FD'}`,
        flexShrink: 0,
      }}>
        {required ? 'Obligatoire' : 'Optionnel'}
      </span>
    );

    // ── Carte personne ──
    const PersonneCard = ({ person, index, assignedByOthers, onChange, onRemove, canRemove, showError = false }) => {
      const set = (k, v) => onChange({ ...person, [k]: v });
      const toggleFn = (fnId) => {
        const fns = person.functions || {};
        onChange({ ...person, functions: { ...fns, [fnId]: !fns[fnId] } });
      };

      // Fonctions disponibles pour cette carte = non prises par les autres + déjà prises par cette carte
      const availableFns = LBC_FUNCTIONS.filter(fn =>
        !assignedByOthers.includes(fn.id) || (person.functions || {})[fn.id]
      );

      const knownPP = PREV_PP_LIST.find(p => p.label === person.selectedOption);
      const isAutre = person.selectedOption === AUTRE_PP;
      const showFields = knownPP || person.searchMode === 'selected' || person.searchMode === 'manual';

      const ppOptions = [
        ...PREV_PP_LIST.map(p => ({ value: p.label, label: p.label })),
        { value: AUTRE_PP, label: '+ Une autre personne' },
      ];

      const handlePickPP = (v) => {
        const base = {
          ...person,
          selectedOption: v,
          searchMode: undefined, searchLabel: '',
          nom: '', prenom: '', conseilRegional: '', civilite: '',
          prenom2: '', prenom3: '', prenom4: '', nomUsage: '',
        };
        onChange(base);
      };

      return (
        <div style={{
          background: T.color.white,
          border: `1px solid ${T.color.border}`,
          borderRadius: T.radius,
          boxShadow: T.shadow.card,
          padding: '24px',
          position: 'relative',
        }}>
          {/* Header carte */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '20px' }}>
            <span style={{ fontSize: '14px', fontWeight: 700, color: T.color.primaryBlue }}>
              Personne {index + 1}
            </span>
            {canRemove && (
              <button onClick={onRemove} style={{
                background: 'none', border: 'none', cursor: 'pointer',
                fontSize: '13px', color: T.color.gray, padding: '4px 8px',
                borderRadius: T.radius, fontFamily: T.font,
              }}>
                Retirer
              </button>
            )}
          </div>

          {/* Sélection de la personne */}
          <div style={{ marginBottom: '20px' }}>
            <FieldSelect
              label="Sélectionnez la personne"
              required
              value={person.selectedOption || ''}
              onChange={handlePickPP}
              options={ppOptions}
              placeholder="Sélectionnez"
            />
            {showError && !person.selectedOption && (
              <p style={{ fontSize: '13px', color: '#DC2626', margin: '4px 0 0 0' }}>
                Ce champ est obligatoire.
              </p>
            )}
          </div>

          {/* PP connue → identité en lecture seule */}
          {knownPP && (
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '20px' }}>
              <ReadOnlyField label="Prénom" value={knownPP.prenom} />
              <ReadOnlyField label="Nom" value={knownPP.nom} />
            </div>
          )}

          {/* Autre personne → recherche */}
          {isAutre && (
            <div style={{ marginBottom: '20px' }}>
              <PersonSearchAutocomplete
                searchMode={person.searchMode}
                selectedLabel={person.searchLabel}
                onSelectPerson={(p) => onChange({
                  ...person,
                  searchMode: 'selected',
                  searchLabel: `${p.civilite} ${p.nom} ${p.prenom} - ${p.region}`,
                  civilite: p.civilite, nom: p.nom, prenom: p.prenom,
                  conseilRegional: p.conseilRegional,
                })}
                onManual={() => onChange({
                  ...person,
                  searchMode: 'manual', searchLabel: '+ Renseignez manuellement',
                  nom: '', prenom: '', conseilRegional: '', civilite: '',
                })}
                onClear={() => onChange({
                  ...person,
                  searchMode: undefined, searchLabel: '',
                  nom: '', prenom: '', conseilRegional: '', civilite: '',
                })}
              />

              {person.searchMode === 'selected' && (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '20px' }}>
                  <ReadOnlyField label="Prénom" value={person.prenom} />
                  <ReadOnlyField label="Nom" value={person.nom} />
                  <ReadOnlyField label="CRO d'inscription principale" value={person.conseilRegional} />
                </div>
              )}

              {person.searchMode === 'manual' && (
                <div style={{ padding: '16px', background: T.color.bg, borderRadius: T.radius, border: `1px solid ${T.color.border}`, marginBottom: '20px' }}>
                  <div style={{ marginBottom: '16px' }}>
                    <p style={{ fontSize: '14px', fontWeight: 600, color: T.color.textDark, margin: '0 0 8px 0' }}>
                      <span style={{ color: '#C81E1E' }}>* </span>Civilité
                    </p>
                    <div style={{ display: 'flex', gap: '24px' }}>
                      {CIVILITE_OPTIONS.map(opt => {
                        const sel = person.civilite === opt;
                        return (
                          <label key={opt} onClick={() => set('civilite', opt)} style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer' }}>
                            <div style={{ width: '20px', height: '20px', borderRadius: '50%', flexShrink: 0, border: `2px solid ${sel ? T.color.primaryBlue : T.color.borderMedium}`, display: 'flex', alignItems: 'center', justifyContent: 'center', background: T.color.white }}>
                              {sel && <div style={{ width: '10px', height: '10px', borderRadius: '50%', background: T.color.primaryBlue }} />}
                            </div>
                            <span style={{ fontSize: '14px', color: T.color.textDark }}>{opt}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '16px', marginBottom: '12px' }}>
                    <FieldInput label="Nom de famille" required value={person.nom || ''} onChange={v => set('nom', v)} />
                    <FieldInput label="Prénom" required value={person.prenom || ''} onChange={v => set('prenom', v)} />
                    <FieldInput label="Nom d'usage" value={person.nomUsage || ''} onChange={v => set('nomUsage', v)} />
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Coordonnées de contact (si personne sélectionnée ou saisie) */}
          {showFields && (
            <div style={{ marginBottom: '20px' }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '12px' }}>
                <FieldInput label="Email professionnel" required value={person.emailPro || ''} onChange={v => set('emailPro', v)} placeholder="xxx@exemple.com" />
                <FieldInput label="Téléphone fixe" value={person.telephoneFixe || ''} onChange={v => set('telephoneFixe', v)} />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                <FieldInput label="Portable" required value={person.portable || ''} onChange={v => set('portable', v)} />
              </div>
            </div>
          )}

          {/* Fonctions assumées */}
          {showFields && availableFns.length > 0 && (
            <div style={{ borderTop: `1px solid ${T.color.border}`, paddingTop: '20px' }}>
              <p style={{ fontSize: '14px', fontWeight: 600, color: T.color.textDark, margin: '0 0 14px 0' }}>
                Fonctions assumées par cette personne
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {availableFns.map(fn => {
                  const checked = !!(person.functions || {})[fn.id];
                  return (
                    <label key={fn.id} onClick={() => toggleFn(fn.id)} style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer', padding: '10px 14px', borderRadius: T.radius, border: `1px solid ${checked ? T.color.primaryBlue : T.color.border}`, background: checked ? '#F0F4FA' : T.color.white, transition: 'all 0.15s' }}>
                      {/* Custom checkbox */}
                      <div style={{ width: '18px', height: '18px', borderRadius: '4px', flexShrink: 0, border: `2px solid ${checked ? T.color.primaryBlue : T.color.borderMedium}`, background: checked ? T.color.primaryBlue : T.color.white, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        {checked && (
                          <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
                            <path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                          </svg>
                        )}
                      </div>
                      <span style={{ fontSize: '14px', color: T.color.textDark, flex: 1, lineHeight: '20px' }}>{fn.label}</span>
                      <FunctionBadge required={fn.required} />
                    </label>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    };

    const StepLBCContent = ({ data, update, showError = false }) => {
      // persons = array of PersonneCard state objects
      const persons = (data && data.persons) ? data.persons : [
        { id: 1, selectedOption: '', functions: { lbcMembre: true, lbcResponsable: true, qualMembre: true, qualResponsable: true } }
      ];

      const setPersons = (newPersons) => update('persons', newPersons);

      // Which function IDs are assigned by ALL OTHER persons (for a given person index)
      const assignedByOthers = (myIndex) => {
        const result = [];
        persons.forEach((p, i) => {
          if (i === myIndex) return;
          LBC_FUNCTIONS.forEach(fn => {
            if ((p.functions || {})[fn.id]) result.push(fn.id);
          });
        });
        return result;
      };

      // Are the 2 required functions covered?
      const coveredFnIds = new Set();
      persons.forEach(p => {
        LBC_FUNCTIONS.forEach(fn => {
          if ((p.functions || {})[fn.id]) coveredFnIds.add(fn.id);
        });
      });
      const requiredCovered = LBC_FUNCTIONS.filter(f => f.required).every(f => coveredFnIds.has(f.id));

      // Are all 4 functions already assigned?
      const allAssigned = LBC_FUNCTIONS.every(fn => coveredFnIds.has(fn.id));

      // Remaining unassigned functions (to show in summary)
      const unassigned = LBC_FUNCTIONS.filter(fn => !coveredFnIds.has(fn.id));

      const addPerson = () => {
        // Pre-check only the unassigned functions
        const newFunctions = {};
        unassigned.forEach(fn => { newFunctions[fn.id] = true; });
        setPersons([...persons, { id: Date.now(), selectedOption: '', functions: newFunctions }]);
      };

      const removePerson = (index) => {
        setPersons(persons.filter((_, i) => i !== index));
      };

      const updatePerson = (index, newPerson) => {
        const updated = persons.map((p, i) => i === index ? newPerson : p);
        setPersons(updated);
      };

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
          {/* Title */}
          <div>
            <h1 style={{ fontSize: '24px', fontWeight: 700, color: T.color.textDark, margin: '0 0 8px 0', lineHeight: '28.8px' }}>
              Interlocuteurs LBC-FT et Qualité
            </h1>
            <p style={{ fontSize: '14px', color: T.color.gray, margin: '0 0 8px 0', lineHeight: '21px' }}>
              Désignez la ou les personnes responsables des fonctions LBC-FT et Qualité. Dans une petite structure, une seule personne peut assumer l'ensemble des fonctions.
            </p>
            <p style={{ fontSize: '13px', color: T.color.gray, margin: 0 }}>
              <span style={{ color: T.color.primaryRed }}>*</span> Champs obligatoires
            </p>
          </div>

          {/* Légende badges */}
          <div style={{ display: 'flex', gap: '12px', alignItems: 'center' }}>
            <FunctionBadge required={true} />
            <span style={{ fontSize: '13px', color: T.color.gray }}>À désigner obligatoirement pour passer à l'étape suivante</span>
            <FunctionBadge required={false} />
            <span style={{ fontSize: '13px', color: T.color.gray }}>Non bloquant</span>
          </div>

          {/* Cartes personnes */}
          {persons.map((person, index) => (
            <PersonneCard
              key={person.id || index}
              person={person}
              index={index}
              assignedByOthers={assignedByOthers(index)}
              onChange={(updated) => updatePerson(index, updated)}
              onRemove={() => removePerson(index)}
              canRemove={persons.length > 1}
              showError={showError}
            />
          ))}

          {/* Bouton ajouter une personne — masqué si toutes les fonctions sont couvertes */}
          {!allAssigned && (
            <button
              onClick={addPerson}
              style={{
                display: 'flex', alignItems: 'center', gap: '8px',
                background: T.color.white, border: `1px dashed ${T.color.borderMedium}`,
                borderRadius: T.radius, padding: '14px 20px', cursor: 'pointer',
                fontSize: '14px', fontWeight: 500, color: T.color.primaryBlue,
                fontFamily: T.font, width: '100%', justifyContent: 'center',
                transition: 'background 0.15s',
              }}
              onMouseEnter={e => e.currentTarget.style.background = T.color.bg}
              onMouseLeave={e => e.currentTarget.style.background = T.color.white}
            >
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3V13M3 8H13" stroke={T.color.primaryBlue} strokeWidth="1.8" strokeLinecap="round"/>
              </svg>
              Ajouter une personne pour les fonctions restantes
            </button>
          )}

          {/* Récapitulatif fonctions non couvertes */}
          {unassigned.length > 0 && (
            <div style={{ padding: '16px', background: '#FEF9EC', border: '1px solid #FDE68A', borderRadius: T.radius }}>
              <p style={{ fontSize: '13px', fontWeight: 600, color: '#92400E', margin: '0 0 8px 0' }}>
                {unassigned.some(f => f.required) ? '⚠ Fonctions obligatoires non encore désignées' : 'Fonctions optionnelles non désignées'}
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                {unassigned.map(fn => (
                  <div key={fn.id} style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <span style={{ fontSize: '13px', color: '#78350F' }}>•</span>
                    <span style={{ fontSize: '13px', color: '#78350F', flex: 1 }}>{fn.label}</span>
                    <FunctionBadge required={fn.required} />
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Message d'erreur : affiché uniquement après tentative de navigation */}
          {showError && !requiredCovered && (
            <p style={{ margin: '0', fontSize: '13px', color: '#DC2626' }}>
              Vous devez désigner un responsable pour chaque fonction obligatoire.
            </p>
          )}

        </div>
      );
    };

    // Step: Liste des associés
    // ============================================================
    const ASSOCIES_DATA = [
      { nom: 'A', capNombre: '4 000', capPct: '34,78%', voteNombre: '7 500', votePct: '40,54%', type: 'ec' },
      { nom: 'B', capNombre: '2 500', capPct: '21,74%', voteNombre: '5 000', votePct: '27,03%', type: 'ec' },
      { nom: 'PM1', capNombre: '700', capPct: '6,09%', voteNombre: '1 200', votePct: '6,49%', type: 'ec' },
      { nom: 'D', capNombre: '400', capPct: '3,48%', voteNombre: '700', votePct: '3,78%', type: 'ec' },
      { nom: 'PM2', capNombre: '200', capPct: '1,74%', voteNombre: '400', votePct: '2,16%', type: 'ec' },
      { nom: 'E', capNombre: '2 200', capPct: '19,13%', voteNombre: '2 200', votePct: '11,89%', type: 'nonec' },
      { nom: 'F', capNombre: '700', capPct: '6,09%', voteNombre: '700', votePct: '3,78%', type: 'nonec' },
      { nom: 'G', capNombre: '200', capPct: '1,74%', voteNombre: '200', votePct: '1,08%', type: 'nonec' },
      { nom: 'H', capNombre: '100', capPct: '0,87%', voteNombre: '100', votePct: '0,54%', type: 'nonec' },
      { nom: 'PM3', capNombre: '500', capPct: '4,35%', voteNombre: '500', votePct: '2,70%', type: 'nonec' },
    ];

    const StepAssociesContent = () => {
      const ecRows = ASSOCIES_DATA.filter(r => r.type === 'ec');
      const nonEcRows = ASSOCIES_DATA.filter(r => r.type === 'nonec');

      const bdr = `1px solid ${T.color.border}`;
      const bdrV = `1px solid ${T.color.border}`;
      const fs = '14px';

      // Data cell
      const cell = {
        padding: '11px 16px', fontSize: fs, color: T.color.textDark,
        borderBottom: bdr, fontFamily: T.font, lineHeight: '20px',
      };
      const cellR = { ...cell, textAlign: 'right', fontVariantNumeric: 'tabular-nums' };

      // Header group (Participation / Droits de vote)
      const hGroup = {
        padding: '12px 16px', fontSize: fs, fontWeight: 700, textAlign: 'center',
        lineHeight: '20px', fontFamily: T.font,
        borderBottom: bdr, background: T.color.white,
      };

      // Sub-header (Nombre / %)
      const hSub = {
        padding: '9px 16px', fontSize: fs, fontWeight: 600, textAlign: 'center',
        color: T.color.gray, borderBottom: bdr, background: T.color.white,
        fontFamily: T.font, lineHeight: '20px',
      };

      // Sub-total row
      const sub = {
        padding: '11px 16px', fontSize: fs, fontWeight: 700, color: T.color.primaryRed,
        background: T.color.redBg, borderBottom: bdr, fontFamily: T.font, lineHeight: '20px',
      };
      const subR = { ...sub, textAlign: 'right', fontVariantNumeric: 'tabular-nums' };

      // Total row
      const tot = {
        padding: '11px 16px', fontSize: fs, fontWeight: 700, color: T.color.white,
        background: T.color.primaryBlue, borderBottom: 'none', fontFamily: T.font, lineHeight: '20px',
      };
      const totR = { ...tot, textAlign: 'right', fontVariantNumeric: 'tabular-nums' };

      // Empty/spacer row
      const emp = {
        padding: '9px 16px', fontSize: fs, color: T.color.gray,
        borderBottom: bdr, fontFamily: T.font, background: T.color.white, lineHeight: '20px',
      };
      const empR = { ...emp, textAlign: 'right', fontVariantNumeric: 'tabular-nums' };

      const renderRow = (r, idx) => (
        <tr key={idx}>
          <td style={{ ...cell, fontWeight: 500, borderRight: bdrV }}>{r.nom}</td>
          <td style={cellR}>{r.capNombre}</td>
          <td style={{ ...cellR, borderRight: bdrV }}>{r.capPct}</td>
          <td style={cellR}>{r.voteNombre}</td>
          <td style={cellR}>{r.votePct}</td>
        </tr>
      );

      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
          <h2 style={{ fontSize: '24px', fontWeight: 700, color: T.color.textDark, margin: '0 0 8px 0', lineHeight: '1.3' }}>
            Liste des associés
          </h2>
          <p style={{ fontSize: '14px', fontWeight: 700, color: T.color.primaryRed, margin: 0 }}>
            Détention en capital et en droits de vote
          </p>
          <p style={{ fontSize: '13px', color: T.color.gray, margin: '8px 0 0 0' }}>
            <span style={{ color: T.color.primaryRed }}>*</span> Champs obligatoires
          </p>

          <div style={{
            background: T.color.white, borderRadius: T.radius, overflow: 'hidden',
            boxShadow: T.shadow.card, border: bdr,
          }}>
            <table style={{ width: '100%', borderCollapse: 'collapse' }}>
              <thead>
                <tr style={{ borderBottom: bdr }}>
                  <th rowSpan="2" style={{ ...hGroup, textAlign: 'left', width: '28%', borderRight: bdrV, borderBottom: bdr, verticalAlign: 'bottom', paddingBottom: '9px' }}>
                    <span style={{ fontSize: fs, color: T.color.textDark }}>Nom Prénom</span><br/>
                    <span style={{ fontWeight: 400, fontSize: fs, color: T.color.gray }}>ou</span>
                  </th>
                  <th colSpan="2" style={{ ...hGroup, color: T.color.primaryBlue, borderRight: bdrV, borderBottom: bdr }}>
                    Participation<br/>au capital
                  </th>
                  <th colSpan="2" style={{ ...hGroup, color: T.color.primaryRed, borderBottom: bdr }}>
                    Droits de vote
                  </th>
                </tr>
                <tr>
                  <th style={{ ...hSub }}>Nombre</th>
                  <th style={{ ...hSub, borderRight: bdrV }}>%</th>
                  <th style={{ ...hSub }}>Nombre</th>
                  <th style={{ ...hSub }}>%</th>
                </tr>
              </thead>
              <tbody>
                {ecRows.map(renderRow)}
                <tr>
                  <td style={{ ...sub, borderRight: bdrV }}>Sous-total EC</td>
                  <td style={subR}>7 800</td>
                  <td style={{ ...subR, borderRight: bdrV }}>67,83%</td>
                  <td style={subR}>14 800</td>
                  <td style={subR}>80,00%</td>
                </tr>
                {nonEcRows.map(renderRow)}
                <tr>
                  <td style={{ ...sub, borderRight: bdrV }}>Sous-total non EC</td>
                  <td style={subR}>3 700</td>
                  <td style={{ ...subR, borderRight: bdrV }}>32,17%</td>
                  <td style={subR}>3 700</td>
                  <td style={subR}>20,00%</td>
                </tr>
                <tr>
                  <td style={{ ...emp, borderRight: bdrV }}></td>
                  <td style={empR}>0</td>
                  <td style={{ ...empR, borderRight: bdrV }}>0,00%</td>
                  <td style={empR}>0</td>
                  <td style={empR}>0,00%</td>
                </tr>
                <tr>
                  <td style={{ ...tot, borderRight: `1px solid rgba(255,255,255,0.2)` }}>Total</td>
                  <td style={totR}>11 500</td>
                  <td style={{ ...totR, borderRight: `1px solid rgba(255,255,255,0.2)` }}>100,00%</td>
                  <td style={totR}>18 500</td>
                  <td style={totR}>100,00%</td>
                </tr>
                <tr>
                  <td style={{ ...emp, borderRight: bdrV, borderBottom: 'none' }}></td>
                  <td style={{ ...empR, borderBottom: 'none' }}>0</td>
                  <td style={{ ...empR, borderRight: bdrV, borderBottom: 'none' }}>0,00%</td>
                  <td style={{ ...empR, borderBottom: 'none' }}>0</td>
                  <td style={{ ...empR, borderBottom: 'none' }}>0,00%</td>
                </tr>
              </tbody>
            </table>
          </div>

          <button style={{
            background: 'none', border: `1px solid ${T.color.border}`, borderRadius: T.radius,
            padding: '8px 20px', cursor: 'pointer', alignSelf: 'flex-start',
            fontSize: '14px', fontWeight: 500, color: T.color.primaryBlue, fontFamily: T.font,
          }}>
            + Ajouter un associé
          </button>
        </div>
      );
    };

    // ============================================================
    // REUSABLE: Text Input
    // ============================================================
    const FieldInput = ({ label, required, value, onChange, type = 'text', placeholder }) => {
      const [focused, setFocused] = useState(false);
      return (
        <div>
          {label && (
            <label style={{
              display: 'block', fontSize: '14px', fontWeight: 500,
              marginBottom: '6px', color: T.color.textDark,
            }}>
              {required && <span style={{ color: T.color.primaryRed, marginRight: '3px' }}>*</span>}
              {label}
            </label>
          )}
          <input
            type={type}
            placeholder={placeholder || ''}
            value={value || ''}
            onChange={(e) => onChange(e.target.value)}
            onFocus={() => setFocused(true)}
            onBlur={() => setFocused(false)}
            style={{
              width: '100%',
              height: '40px',
              border: `1px solid ${focused ? T.color.primaryBlue : T.color.border}`,
              borderRadius: T.radius,
              padding: '0 14px',
              fontSize: '14px',
              color: T.color.textDark,
              background: T.color.white,
              outline: 'none',
              transition: 'border-color 0.15s',
            }}
          />
        </div>
      );
    };

    // ============================================================
    // REUSABLE: Select
    // ============================================================
    const FieldSelect = ({ label, required, value, onChange, options, placeholder, height = '36px' }) => {
      const [focused, setFocused] = useState(false);
      return (
        <div>
          {label && (
            <label style={{
              display: 'block', fontSize: '14px', fontWeight: 500,
              marginBottom: '6px', color: T.color.textDark,
            }}>
              {required && <span style={{ color: T.color.primaryRed, marginRight: '3px' }}>*</span>}
              {label}
            </label>
          )}
          <div style={{ position: 'relative' }}>
            <select
              value={value || ''}
              onChange={(e) => onChange(e.target.value)}
              onFocus={() => setFocused(true)}
              onBlur={() => setFocused(false)}
              style={{
                width: '100%',
                height: height,
                border: `1px solid ${focused ? T.color.primaryBlue : T.color.border}`,
                borderRadius: T.radius,
                padding: '0 36px 0 14px',
                fontSize: '14px',
                color: value ? T.color.textDark : T.color.gray,
                background: T.color.white,
                appearance: 'none',
                outline: 'none',
                transition: 'border-color 0.15s',
              }}
            >
              {placeholder && <option value="">{placeholder}</option>}
              {options.map((opt, i) => {
                const v = typeof opt === 'object' ? opt.value : opt;
                const l = typeof opt === 'object' ? opt.label : opt;
                const dis = typeof opt === 'object' ? (opt.disabled || false) : false;
                return <option key={i} value={v} disabled={dis} style={dis ? { color: '#9CA3AF', fontStyle: 'italic' } : {}}>{l}</option>;
              })}
            </select>
            <div style={{
              position: 'absolute', right: '12px', top: '50%', transform: 'translateY(-50%)',
              pointerEvents: 'none',
            }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={T.color.gray} strokeWidth="2.5">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
          </div>
        </div>
      );
    };

    // ============================================================
    // APP
    // ============================================================
    const App = () => {
      const [currentStep, setCurrentStep] = useState(1);
      const [step1, setStep1] = useState({});
      const [step3, setStep3] = useState({});
      const [step4, setStep4] = useState({});
      const [step5, setStep5] = useState({});
      const [stepPCP, setStepPCP] = useState({});
      const [stepLBC, setStepLBC] = useState({});
      const [stepAdmin, setStepAdmin] = useState({});
      const [step4Attempted, setStep4Attempted] = useState(false);
      const [lbcAttempted, setLbcAttempted] = useState(false);

      const updateStep1 = useCallback((path, value) => {
        setStep1(prev => {
          const next = { ...prev };
          const parts = path.split('.');
          if (parts.length === 1) {
            next[parts[0]] = value;
          } else if (parts.length === 2) {
            next[parts[0]] = { ...(next[parts[0]] || {}), [parts[1]]: value };
          }
          return next;
        });
      }, []);

      // Dynamic steps based on state
      const hasPM = !!(step4 && step4.declarePersonneMorale);
      const steps = buildSteps(hasPM, step1.profile, step3.formeJuridique);

      const updateStepAdmin = useCallback((key, value) => {
        setStepAdmin(prev => ({ ...prev, [key]: typeof value === 'function' ? value(prev[key]) : value }));
      }, []);

      // Validation: Step 1 requires profile + qualite + croec
      const isStep1Valid = () => {
        if (!step1.profile || !step1.qualite || !step1.croec) return false;
        if (step1.qualite === 'mandataire') {
          const m = step1.mandataire || {};
          if (!m.civilite || !m.nom || !m.prenom || !m.fonction || !m.telephone || !m.email || !m.rue || !m.codePostal || !m.ville || !m.pays) {
            return false;
          }
        }
        return true;
      };

      const goNext = () => {
        const stepName = steps[currentStep - 1];
        if (stepName === "Représentants Légaux" && !step4.declarePersonnePhysique && !step4.declarePersonneMorale) {
          setStep4Attempted(true);
          return;
        }
        if (stepName === LBC_STEP) {
          const persons = (stepLBC && stepLBC.persons) ? stepLBC.persons : [];
          const covered = new Set();
          persons.forEach(p => { LBC_FUNCTIONS.forEach(fn => { if ((p.functions || {})[fn.id]) covered.add(fn.id); }); });
          const valid = LBC_FUNCTIONS.filter(f => f.required).every(f => covered.has(f.id));
          if (!valid) { setLbcAttempted(true); return; }
        }
        setStep4Attempted(false);
        setLbcAttempted(false);
        window.scrollTo(0, 0);
        setCurrentStep(prev => Math.min(prev + 1, steps.length));
      };
      const goPrev = () => {
        setStep4Attempted(false);
        setLbcAttempted(false);
        window.scrollTo(0, 0);
        setCurrentStep(prev => Math.max(prev - 1, 1));
      };

      const updateStep3 = useCallback((key, value) => {
        setStep3(prev => ({ ...prev, [key]: value }));
      }, []);

      const updateStep4 = useCallback((key, value) => {
        setStep4(prev => ({ ...prev, [key]: typeof value === 'function' ? value(prev[key]) : value }));
      }, []);

      const updateStep5 = useCallback((key, value) => {
        setStep5(prev => ({ ...prev, [key]: typeof value === 'function' ? value(prev[key]) : value }));
      }, []);

      const updateStepPCP = useCallback((key, value) => {
        setStepPCP(prev => ({ ...prev, [key]: typeof value === 'function' ? value(prev[key]) : value }));
      }, []);

      const updateStepLBC = useCallback((key, value) => {
        setStepLBC(prev => ({ ...prev, [key]: typeof value === 'function' ? value(prev[key]) : value }));
      }, []);

      const renderStep = () => {
        const stepName = steps[currentStep - 1];
        switch (stepName) {
          case "Qualité de la PM & CROEC": return <Step1Content data={step1} update={updateStep1} />;
          case "Dates de sessions": return <Step2Content croec={step1.croec} />;
          case "Caractéristiques de la société et renseignements divers": return <Step3Content data={step3} update={updateStep3} profile={step1.profile} />;
          case "Représentants Légaux": return <Step4Content data={step4} update={updateStep4} profile={step1.profile} showError={step4Attempted} />;
          case EXTRA_STEP: return <Step5Content data={step5} update={updateStep5} />;
          case ADMIN_STEP: return <StepAdminContent data={stepAdmin} update={updateStepAdmin} formeJuridique={step3.formeJuridique} />;
          case "Personne de contact principal": return <StepPCPContent data={stepPCP} update={updateStepPCP} />;
          case LBC_STEP: return <StepLBCContent data={stepLBC} update={updateStepLBC} showError={lbcAttempted} />;
          case "Liste des associés": return <StepAssociesContent />;
          default: return (
            <div style={{ padding: '40px', textAlign: 'center', color: T.color.gray }}>
              <h2 style={{ fontSize: '24px', fontWeight: 700, color: T.color.textDark, marginBottom: '16px' }}>
                {stepName}
              </h2>
              <p>Étape à venir — construction étape par étape.</p>
            </div>
          );
        }
      };

      const canNext = true;

      return (
        <div style={{ minHeight: '100vh', background: T.color.bg }}>
          <Navbar />

          {/* Main layout */}
          <div style={{
            display: 'flex',
            paddingTop: '80px',
            paddingBottom: '72px',
            minHeight: '100vh',
          }}>
            {/* Sidebar */}
            <Stepper currentStep={currentStep} steps={steps} />

            {/* Content area */}
            <div style={{
              flex: 1,
              padding: '40px 48px',
              maxWidth: '912px',
            }}>
              {renderStep()}
            </div>
          </div>

          {/* Bottom bar */}
          <BottomBar
            canNext={canNext}
            onNext={goNext}
            onPrev={goPrev}
            onSave={() => alert('Formulaire enregistré pour plus tard.')}
            showPrev={currentStep > 1}
            showSave={currentStep !== 2}
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
