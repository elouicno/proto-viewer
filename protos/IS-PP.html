                      onChange={e => { setAdresseQuery(e.target.value); update('adresse', e.target.value); setAdresseOpen(true); if (!e.target.value) { update('rue',''); update('codePostal',''); update('ville',''); update('pays',''); } }}
                      onFocus={() => setAdresseOpen(true)}
                      placeholder="Saisissez une adresse..."
                      style={{ width: '100%', height: '40px', padding: '0 12px', border: `1px solid ${T.color.borderMedium}`, borderRadius: T.radius, fontSize: '14px', outline: 'none', color: T.color.textDark, background: T.color.white, fontFamily: T.font }}
                      onFocusCapture={e => e.target.style.borderColor = T.color.primaryBlue}
                      onBlurCapture={e => e.target.style.borderColor = T.color.borderMedium}
                    />
                    {adresseOpen && adresseSuggestions.length > 0 && (
                      <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, zIndex: 50, background: T.color.white, border: `1px solid ${T.color.borderMedium}`, borderRadius: T.radius, boxShadow: T.shadow.card, marginTop: '2px' }}>

                <FieldInput label="Rue" required value={data.rue} onChange={v => update('rue', v)} />

                <FieldInput label="Lieu-dit" value={data.lieuDit || ''} onChange={v => update('lieuDit', v)} />
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <FieldInput label="Code postal" required value={data.codePostal} onChange={v => update('codePostal', v)} />

                </div>
                <FieldSelect

                  required

                  onChange={v => update('pays', v)}

            </Card>

          {/* Mode d'exercice */}
          {showModeExercice && (
            <Card>
              <FieldSelect
                label="Quel sera votre mode d'exercice ?"
                required
                value={data.modeExercice}
                onChange={v => update('modeExercice', v)}
                options={MODE_EXERCICE_OPTIONS}
                placeholder="-- Aucun --"

            </Card>
          )}

          {/* Contact — toujours visible */}
          <Card>
            <SectionTitle>Informations professionnelles de contact</SectionTitle>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '4px' }}>
              <div>
                <FieldInput
                  label="Portable"
                  required
                  value={data.portable}
                  onChange={v => update('portable', v)}
                  placeholder="+33 6 12 34 56 78"
                  type="tel"
                />
                {showError && !data.portable && <ErrMsg />}
              </div>
              <FieldInput
                label="Fixe"
                value={data.fixe}
                onChange={v => update('fixe', v)}
                placeholder="+33 1 23 45 67 89"
                type="tel"
              />
            </div>
            <div style={{ marginTop: '16px' }}>
              <FieldInput
                label="Adresse email professionnelle (qui vous est dediée)"
                required
                value={data.email}
                onChange={v => update('email', v)}
                placeholder="prenom.nom@operateur.com"
                type="email"
              />
              {showError && !data.email && <ErrMsg />}
            </div>
          </Card>
        </div>
      );
    };

    // ============================================================
    // STEP 4: PIÈCES JUSTIFICATIVES — File Upload Modal
    // ============================================================
    const FileUploadModal = ({ doc, onClose, files, setFiles }) => {
      const [dragging, setDragging] = useState(false);

      const handleDrop = (e) => {
        e.preventDefault();
        setDragging(false);
        const droppedFiles = Array.from(e.dataTransfer.files);
        setFiles(prev => ({ ...prev, [doc.id]: [...(prev[doc.id] || []), ...droppedFiles.map(f => f.name)] }));
      };

      const handleInputChange = (e) => {
        const selected = Array.from(e.target.files);
        setFiles(prev => ({ ...prev, [doc.id]: [...(prev[doc.id] || []), ...selected.map(f => f.name)] }));
      };

      const removeFile = (fileName) => {
        setFiles(prev => ({ ...prev, [doc.id]: (prev[doc.id] || []).filter(f => f !== fileName) }));
      };

      const currentFiles = files[doc.id] || [];

      return (
        <div style={{
          position: 'fixed', inset: 0, zIndex: 500,
          background: 'rgba(0,0,0,0.5)',

                <div style={{ fontSize: '13px', color: T.color.gray, marginTop: '2px' }}>{doc.desc}</div>
              </div>

                </svg>

            </div>

                </svg>
                <p style={{ fontSize: '14px', fontWeight: 500, color: T.color.textDark, marginBottom: '6px' }}>
                  Déposez votre fichier ici

                <p style={{ fontSize: '13px', color: T.color.gray, marginBottom: '16px' }}>
                  ou

                <label style={{
                  display: 'inline-block', padding: '8px 20px',

        </div>
      );
    };

    const DOCUMENTS = [
      {

    const Step4Content = ({ files, setFiles, showError }) => {

      return (
        <div>
          <StepHeader title="Pièces justificatives" />

          {/* Summary bar */}
          <div style={{
            padding: '14px 20px', marginBottom: '24px',
            background: totalFiles > 0 ? T.color.successBg : T.color.bg,
            border: `1px solid ${totalFiles > 0 ? T.color.successBorder : T.color.border}`,

            <div style={{ fontSize: '14px', color: T.color.textDark }}>

          </div>

          {DOCUMENTS.map((doc) => {
            const docFiles = files[doc.id] || [];
            const hasFiles = docFiles.length > 0;

            return (
              <Card key={doc.id} style={{ marginBottom: '16px' }}>
                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '20px' }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                      <span style={{ fontSize: '14px', fontWeight: 600, color: T.color.textDark }}>{doc.title}</span>
                      {doc.required ? (
                        <span style={{ fontSize: '11px', fontWeight: 500, color: T.color.primaryRed, background: T.color.redBg, padding: '2px 8px', borderRadius: '20px' }}>Obligatoire</span>
                      ) : (
                        <span style={{ fontSize: '11px', fontWeight: 500, color: T.color.gray, background: T.color.bg, padding: '2px 8px', borderRadius: '20px', border: `1px solid ${T.color.border}` }}>Facultatif</span>

                      }}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        {doc.templateLabel}
                      </a>
                    )}
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '8px' }}>
                    {hasFiles && (
                      <div style={{

                        color: T.color.successText,
                        display: 'flex', alignItems: 'center', gap: '4px',
                      }}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                        {docFiles.length} fichier(s)
                      </div>
                    )}
                    <button
                      onClick={() => setOpenModal(doc)}
                      style={{
                        height: '36px', padding: '0 16px',
                        border: hasFiles ? `1px solid ${T.color.border}` : 'none',
                        borderRadius: T.radius,
                        background: hasFiles ? T.color.white : T.color.primaryBlue,
                        cursor: 'pointer',
                        fontSize: '13px', fontWeight: 500,
                        color: hasFiles ? T.color.primaryBlue : T.color.white,
                        display: 'flex', alignItems: 'center', gap: '6px', fontFamily: T.font,
                      }}
                    >
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        {hasFiles ? (
                          <><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></>
                        ) : (
                          <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>
                        )}
                      </svg>
                      {hasFiles ? 'Modifier' : 'Ajouter des fichiers'}
                    </button>
                  </div>
                </div>
                {showError && doc.required && !hasFiles && (
                  <p style={{ marginTop: '6px', fontSize: '13px', color: T.color.primaryRed }}>Erreur:Saisie obligatoire.</p>
                )}
                {hasFiles && (
                  <div style={{ marginTop: '12px', display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                    {docFiles.map((fname, i) => (
                      <div key={i} style={{
                        display: 'inline-flex', alignItems: 'center', gap: '6px',
                        padding: '4px 10px', background: T.color.successBg,
                        border: `1px solid ${T.color.successBorder}`, borderRadius: '20px',
                        fontSize: '12px', color: T.color.successText,
                      }}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                          <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        {fname}
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            );
          })}

          {openModal && (
            <FileUploadModal doc={openModal} onClose={() => setOpenModal(null)} files={files} setFiles={setFiles} />
          )}
        </div>
      );
    };

    // ============================================================
    // STEP 5: CONFIRMATION ET SOUMISSION
    // ============================================================
    const Step5Content = ({ certified, onCertifiedChange, submitted, showError }) => {
      if (submitted) {
        return (
          <div style={{ maxWidth: '600px', margin: '0 auto', textAlign: 'center', padding: '40px 20px' }}>
            <div style={{
              width: '80px', height: '80px', borderRadius: '50%',
              background: T.color.successBg, border: `2px solid ${T.color.successBorder}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              margin: '0 auto 24px',
            }}>
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#16A34A" strokeWidth="2.5">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <h1 style={{ fontSize: '24px', fontWeight: 700, color: T.color.textDark, marginBottom: '12px' }}>
              Demande soumise avec succès
            </h1>
            <p style={{ fontSize: '15px', color: T.color.gray, lineHeight: '24px' }}>
              Votre demande d'inscription secondaire a été soumise. Vous recevrez un email de confirmation à l'adresse indiquée dans votre dossier.
            </p>
          </div>
        );
      }

      return (
        <div>
          <StepHeader title="Confirmation soumission de votre demande" />

          <Card>
            <p style={{ fontSize: '14px', color: T.color.textDark, lineHeight: '22px', marginBottom: '20px' }}>
              Je m'engage à communiquer au Conseil régional de l'Ordre, dans un délai maximum de deux mois, tout changement intervenu dans mon adresse ou ma situation professionnelle, et à joindre les justificatifs correspondants.
            </p>
            <label style={{ display: 'flex', alignItems: 'flex-start', gap: '10px', cursor: 'pointer' }}>
              <div
                onClick={() => onCertifiedChange(!certified)}
                style={{
                  width: '18px', height: '18px', borderRadius: '3px', flexShrink: 0,
                  border: `2px solid ${certified ? T.color.primaryBlue : T.color.borderMedium}`,
                  background: certified ? T.color.primaryBlue : T.color.white,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  marginTop: '1px', cursor: 'pointer',
                }}
              >
                {certified && (
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={T.color.white} strokeWidth="3">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                )}
              </div>
              <span style={{ fontSize: '14px', color: T.color.textDark, lineHeight: '20px' }}>
                Je certifie sincères et véritables les informations contenues dans le présent questionnaire
              </span>
            </label>
            {showError && !certified && (
              <p style={{ marginTop: '10px', fontSize: '13px', color: T.color.primaryRed }}>Erreur:Saisie obligatoire.</p>
            )}
          </Card>
        </div>
      );
    };

    // ============================================================
    // APP
    // ============================================================
    const App = () => {
      const [currentStep, setCurrentStep] = useState(1);
      const [step1, setStep1] = useState({});
      const [step3, setStep3] = useState({});
      const [files, setFiles] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [certified, setCertified] = useState(false);
      const [attempted, setAttempted] = useState(false);

      const update1 = useCallback((key, value) => setStep1(prev => ({ ...prev, [key]: value })), []);
      const update3 = useCallback((key, value) => setStep3(prev => ({ ...prev, [key]: value })), []);

      const isStep1Valid = () => !!step1.croec;

      const isStep3Valid = () => {
        if (!step3.lieeStructure) return false;
        if (!step3.portable || !step3.email) return false;
        if (step3.lieeStructure === 'oui') {
          if (!step3.typeExercice) return false;
          if (step3.typeExercice === 'Bureau secondaire' && !step3.bureauInscrit) return false;
          if (!step3.denominationSociale) return false;
        }
        if (step3.lieeStructure === 'non') {
          if (!step3.structureInscrite) return false;
          if (!step3.typeExercice) return false;
          if (step3.typeExercice === 'Bureau secondaire' && !step3.bureauInscrit) return false;
          if (!step3.denominationSociale) return false;
        }
        return true;
      };

      const isStep4Valid = () => {
        const requiredDocs = DOCUMENTS.filter(d => d.required);
        return requiredDocs.every(d => (files[d.id] || []).length > 0);
      };

      const goNext = () => {
        if (currentStep === 1 && !isStep1Valid()) { setAttempted(true); return; }
        if (currentStep === 3 && !isStep3Valid()) { setAttempted(true); return; }
        if (currentStep === 4 && !isStep4Valid()) { setAttempted(true); return; }
        if (currentStep === 5 && !certified) { setAttempted(true); return; }
        setAttempted(false);
        window.scrollTo(0, 0);
        if (currentStep === STEPS.length) {
          handleSubmit();
        } else {
          setCurrentStep(prev => Math.min(prev + 1, STEPS.length));
        }
      };

      const goPrev = () => {
        setAttempted(false);
        window.scrollTo(0, 0);
        setCurrentStep(prev => Math.max(prev - 1, 1));
      };

      const handleSave = () => {
        alert('Votre dossier a été enregistré. Vous pourrez le reprendre ultérieurement depuis votre espace personnel.');
      };

      const handleSubmit = () => {
        setSubmitted(true);
        window.scrollTo(0, 0);
      };

      const renderStep = () => {
        switch (currentStep) {
          case 1: return <Step1Content data={step1} update={update1} showError={attempted} />;
          case 2: return <Step2Content croec={step1.croec} />;
          case 3: return <Step3Content data={step3} update={update3} showError={attempted} />;
          case 4: return <Step4Content files={files} setFiles={setFiles} showError={attempted} />;
          case 5: return <Step5Content certified={certified} onCertifiedChange={setCertified} submitted={submitted} showError={attempted} />;
          default: return null;
        }
      };

      const isLastStep = currentStep === STEPS.length;

      return (
        <div style={{ minHeight: '100vh', background: T.color.bg }}>
          <Navbar />
          {/* Main layout: sidebar + content */}
          <div style={{
            display: 'flex',
            paddingTop: '80px',
            paddingBottom: '72px',
            minHeight: '100vh',
          }}>
            <Stepper currentStep={currentStep} steps={STEPS} />
            <div style={{
              flex: 1,
              padding: '40px 48px',
              maxWidth: 'calc(100% - 300px)',
              overflowX: 'hidden',
            }}>
              {renderStep()}
            </div>
          </div>
          {!submitted && (
            <BottomBar
              onNext={goNext}
              onPrev={goPrev}
              onSave={handleSave}
              showPrev={currentStep > 1}
              showSave={true}
              nextLabel={isLastStep ? 'Soumettre' : 'Suivant'}
            />
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
