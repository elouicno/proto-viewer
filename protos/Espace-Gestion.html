// AccountRecordPage — fiche Account (société) ouverte depuis Activités
// ══════════════════════════════════════════════════════════════
const ACCOUNT_TABS_VISIBLE = [
  { key: "etablissement", label: "Établissement" },
  { key: "activites",     label: "Activités"     },
  { key: "rac",           label: "RAC"           },
  { key: "adminprov",     label: "Admin. Prov"   },
  { key: "stats",         label: "Stats"         },
  { key: "cac",           label: "CAC"           },
  { key: "reseaux",       label: "Réseaux"       },
];
const ACCOUNT_TABS_MORE = [
  { key: "panels",        label: "Panels"        },
  { key: "info",          label: "Info"          },
];
const ACCOUNT_TABS = [...ACCOUNT_TABS_VISIBLE, ...ACCOUNT_TABS_MORE];

function AccountTabBar({ activeTab, onTabChange }) {
  const [moreOpen, setMoreOpen] = React.useState(false);
  const moreRef = React.useRef(null);
  const activeInMore = ACCOUNT_TABS_MORE.some(t => t.key === activeTab);

  React.useEffect(() => {
    if (!moreOpen) return;
    const handleClick = (e) => {
      if (moreRef.current && !moreRef.current.contains(e.target)) setMoreOpen(false);
    };
    document.addEventListener("mousedown", handleClick);
    return () => document.removeEventListener("mousedown", handleClick);
  }, [moreOpen]);

  return (
    <div className="flex w-full">
      <div className="flex overflow-x-auto">
        {ACCOUNT_TABS_VISIBLE.map(tab => (
          <button
            key={tab.key}
            onClick={() => onTabChange(tab.key)}
            className={`px-3 h-10 text-[14px] font-semibold whitespace-nowrap ${
              activeTab === tab.key
                ? "text-[#0250D9] border-b-[3px] border-[#0250D9]"
                : "text-[#5C5C5C] border-b border-[#C9C9C9]"
            }`}
          >{tab.label}</button>
        ))}
      </div>
      <div className="relative shrink-0" ref={moreRef}>
        <button
          onClick={() => setMoreOpen(o => !o)}
          className={`px-3 h-10 text-[14px] font-semibold whitespace-nowrap flex items-center gap-1 ${
            activeInMore
              ? "text-[#0250D9] border-b-[3px] border-[#0250D9]"
              : "text-[#5C5C5C] border-b border-[#C9C9C9]"
          }`}
        >
          Plus <ChevronDown size={14} />
        </button>
        {moreOpen && (
          <div className="absolute top-full left-0 bg-white border border-[#C9C9C9] rounded shadow-lg min-w-[160px]" style={{zIndex:200}}>
            {ACCOUNT_TABS_MORE.map(tab => (
              <button
                key={tab.key}
                onClick={() => { onTabChange(tab.key); setMoreOpen(false); }}
                className={`w-full text-left px-4 py-2 text-[13px] hover:bg-[#F3F3F3] ${
                  activeTab === tab.key ? "text-[#0250D9] font-semibold" : "text-[#03234D]"
                }`}
              >{tab.label}</button>
            ))}
          </div>
        )}
      </div>
      <div className="flex-1 border-b border-[#C9C9C9]" />
    </div>

const DEMANDE_PATH_STEPS = [
  { key: "recu",        label: "Reçu",                       done: true  },
  { key: "verifie",     label: "Vérifié",                    done: true  },
  { key: "complet",     label: "Complet",                    done: true  },
  { key: "complete",    label: "Complète",                   done: false, current: false },
  { key: "commission",  label: "Prête pour commission",     done: false, current: false },
  { key: "session",     label: "Prête pour session",          done: false, current: false },
  { key: "ferme",       label: "Fermé",                      done: false, current: true  },
];

function DemandePathStep({ step, index, total, onClick }) {
  const isFirst = index === 0;
  const isLast  = index === total - 1;

  /* ── SVG-based chevron path (same technique as Record.html PathStep) ── */
  const D = 10;   // profondeur de la pointe en unités viewBox
  const R = 14;   // rayon arrondi des extrémités (= H/2 pour un demi-cercle parfait)
  const W = 100;  // largeur de base en unités viewBox
  const H = 28;   // hauteur en px (viewBox height)

  const bg        = step.done ? "#acf3e4" : step.current ? "#032d60" : "#e5e5e5";
  const textColor = step.current ? "white" : "#03234d";

  // Premier : arrondi gauche + pointe droite
  // Dernier : encoche gauche + arrondi droit
  // Milieu  : encoche gauche + pointe droite
  let shapePath;
  if (isFirst) {
    shapePath = `M${R},0 L${W},0 L${W+D},${H/2} L${W},${H} L${R},${H} A${R},${R} 0 0,1 ${R},0 Z`;
  } else if (isLast) {
    shapePath = `M0,0 L${W-R},0 A${R},${R} 0 0,1 ${W-R},${H} L0,${H} L${D},${H/2} Z`;
  } else {
    shapePath = `M0,0 L${W},0 L${W+D},${H/2} L${W},${H} L0,${H} L${D},${H/2} Z`;
  }

  // viewBox width : W+D pour premier/milieu (la pointe dépasse), W pour le dernier
  const vbW = isLast ? W : W + D;

  return (
    <div
      onClick={onClick}
      style={{
        flex: 1, minWidth: 0, height: H,
        position: "relative",
        marginRight: isLast ? 0 : "-5px",
        cursor: onClick ? "pointer" : "default",
      }}
    >
      {/* Forme SVG — s'étire en largeur, overflow visible pour la pointe */}
      <svg
        style={{ position: "absolute", inset: 0, width: "100%", height: "100%", overflow: "visible" }}
        viewBox={`0 0 ${vbW} ${H}`}
        preserveAspectRatio="none"
      >
        <path d={shapePath} fill={bg} />
      </svg>

      {/* Contenu centré */}
      <div style={{
        position: "absolute", inset: 0,
        display: "flex", alignItems: "center", justifyContent: "center",
        paddingLeft:  isFirst ? R + 4 : D + 8,
        paddingRight: isLast  ? R + 4 : D + 4,
      }}>
        {step.done ? (
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#056764" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        ) : (
          <span style={{fontSize:11, color:textColor, fontWeight:step.current?600:400, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{step.label}</span>
        )}
      </div>
    </div>
  );
}

// ── Hash routing helpers ──────────────────────────────────────
const pageToHash = (page) => page === "list" ? "stagiaires" : page;
const hashToPage = (hash) => (!hash || hash === "stagiaires") ? "list" : hash;

// Détecte si on est dans un iframe (Proto Viewer) ou en standalone
const IN_IFRAME = window.self !== window.top;

// Lit le hash de vue courant (toujours décodé)
const readCurrentHash = () => {
  if (IN_IFRAME) {
    try {
      const parentHash = window.parent.location.hash;
      const parts = parentHash.split("|");
      return parts.length > 1 ? decodeURIComponent(parts[1]) : "stagiaires";
    } catch(e) { return "stagiaires"; }
  }
  try {
    return decodeURIComponent(window.location.hash.slice(1)) || "stagiaires";
  } catch(e) {
    return window.location.hash.slice(1) || "stagiaires";
  }
};

// Écrit le hash de vue (en préservant le chemin proto en iframe)
const writeHash = (hash) => {
  if (IN_IFRAME) {
    try {
      const parentHash = window.parent.location.hash;
      const protoPath = parentHash.split("|")[0]; // "#protos%2FEspace-Gestion.html"
      const newHash = hash === "stagiaires" ? protoPath : protoPath + "|" + hash;
      window.parent.history.pushState(null, "", newHash);
      // Notify patch via custom event (pushState doesn't fire hashchange)
      try { window.parent.dispatchEvent(new window.parent.CustomEvent('pvViewChange', { detail: { view: hash } })); } catch(e2) {}
    } catch(e) {}
  } else {
    let current = "";
    try { current = decodeURIComponent(window.location.hash.slice(1)); } catch(e) { current = window.location.hash.slice(1); }
    if (current !== hash) {
      window.history.pushState(null, "", "#" + hash);
    }
  }
};

// Reconstruit les onglets ouverts depuis le hash initial (refresh sur URL directe)
function initTabsFromHash() {
  const hash = readCurrentHash();
  if (!hash || hash === "stagiaires" || hash === "list" || hash === "demandes" || hash === "groupes") return [];
  if (hash.startsWith("contact:")) {
    const key = hash.slice("contact:".length);
    const demande = DEMANDES_LIST.find(d => d.demandeur.replace(/\s+/g, "_") === key);
    if (demande) return [{ type: "contact", id: hash, label: demande.demandeur, data: demande }];
    // fallback complet pour que buildContactData ne plante pas
    const name = key.replace(/_/g, " ");
    return [{ type: "contact", id: hash, label: name, data: {
      demandeur: name, num: "#000000000", profil: "Article 27",
      statut: "Soumise", dateSoumission: "", statutPieces: "",
      proprietaire: "", type: "", nomComptable: ""
    }}];
  }
  if (hash.startsWith("record:")) {
    const num = hash.slice("record:".length);
    const row = STAGIAIRES_LIST.find(s => s.numInscription === num);
    if (row) return [{ type: "record", id: hash, label: row.stagiaire, data: row }];
    return [{ type: "record", id: hash, label: num, data: { numInscription: num, stagiaire: num, cr: "Île-de-France" } }];
  }
  if (hash.startsWith("account:")) {
    const num = hash.slice("account:".length);
    return [{ type: "account", id: hash, label: num, data: { numInscription: num, denomination: num } }];
  }
  if (hash.startsWith("societe:")) {
    const num = hash.slice("societe:".length);
    return [{ type: "societe", id: hash, label: num, data: { numInscription: num, denomination: num } }];
  }
  if (hash.startsWith("groupe:")) {
    const num = hash.slice("groupe:".length);
    const row = GROUPES_LIST.find(g => g.numero === num);
    if (row) return [{ type: "groupe", id: hash, label: row.libelle, data: row }];
    return [{ type: "groupe", id: hash, label: num, data: { numero: num, libelle: num } }];
  }
  if (hash.startsWith("demande:")) {
    const num = hash.slice("demande:".length);
    const row = DEMANDES_LIST.find(d => d.num === num);
    if (row) return [{ type: "demande", id: hash, label: row.num, data: row }];
    // Fallback minimal pour éviter la page blanche même si le num est inconnu
    return [{ type: "demande", id: hash, label: num, data: {
      num, type: "", demandeur: "", statut: "Soumise",
      dateSoumission: "", statutPieces: "", proprietaire: "",
      nomComptable: "", profil: ""
    }}];
  }
  return [];
}

function App() {
  const [activePage, setActivePageState] = useState(() => hashToPage(readCurrentHash()));
  const [openTabs, setOpenTabs] = useState(() => initTabsFromHash());

  const setActivePage = React.useCallback((page) => {
    writeHash(pageToHash(page));
    setActivePageState(page);
  }, []);

  // Back / Forward — écoute sur la bonne fenêtre
  React.useEffect(() => {
    const target = IN_IFRAME ? window.parent : window;
    const onPop = () => {
      const newPage = hashToPage(readCurrentHash());
      setActivePageState(newPage);
      // Si l'onglet cible n'est pas encore ouvert, le reconstruire depuis le hash
      setOpenTabs(prev => {
        if (prev.find(t => t.id === newPage)) return prev; // déjà là
        const restored = initTabsFromHash();
        if (restored.length === 0) return prev;
        return [...prev, ...restored.filter(r => !prev.find(p => p.id === r.id))];
      });
    };
    try { target.addEventListener("popstate", onPop); }
    catch(e) { window.addEventListener("popstate", onPop); }
    return () => {
      try { target.removeEventListener("popstate", onPop); }
      catch(e) { window.removeEventListener("popstate", onPop); }
    };
  }, []);

  const handleNavigateToRecord = (row) => {
    const tabId = "record:" + row.numInscription;
    setOpenTabs(prev => {
      const exists = prev.find(t => t.id === tabId);
      if (!exists) return [...prev, { type: "record", id: tabId, label: row.stagiaire, data: row }];
      return prev;
    });
    setActivePage(tabId);
  };

  const handleNavigateToContact = (demande) => {
    const tabId = "contact:" + demande.demandeur.replace(/\s+/g, "_");
    setOpenTabs(prev => {
      const exists = prev.find(t => t.id === tabId);
      if (!exists) return [...prev, { type: "contact", id: tabId, label: demande.demandeur, data: demande }];
      return prev;
    });
    setActivePage(tabId);
  };

  const handleNavigateToAccount = (account) => {
    const tabId = "account:" + account.numInscription;
    setOpenTabs(prev => {
      const exists = prev.find(t => t.id === tabId);
      if (!exists) return [...prev, { type: "account", id: tabId, label: account.denomination, data: account }];
      return prev;
    });
    setActivePage(tabId);
  };

  const handleNavigateToSociete = (societe) => {
    const tabId = "societe:" + societe.numInscription;
    setOpenTabs(prev => {
      const exists = prev.find(t => t.id === tabId);
      if (!exists) return [...prev, { type: "societe", id: tabId, label: societe.denomination, data: societe }];
      return prev;
    });
    setActivePage(tabId);
  };

  const handleNavigateToDemande = (row) => {
    const tabId = "demande:" + row.num;
    setOpenTabs(prev => {
      const exists = prev.find(t => t.id === tabId);
      if (!exists) return [...prev, { type: "demande", id: tabId, label: row.num, data: row }];
      return prev;
    });
    setActivePage(tabId);
  };

  const handleNavigateToGroupe = (row) => {
    const tabId = "groupe:" + row.numero;
    setOpenTabs(prev => {
      const exists = prev.find(t => t.id === tabId);
      if (!exists) return [...prev, { type: "groupe", id: tabId, label: row.libelle, data: row }];
      return prev;
    });
    setActivePage(tabId);
  };

  const handleCloseTab = (e, tabId) => {
    e.stopPropagation();
    setOpenTabs(prev => prev.filter(t => t.id !== tabId));
    if (activePage === tabId) setActivePage("list");
  };

  // Determine what to render
  const isListActive = activePage === "list";
  const isGroupesActive = activePage === "groupes";
  const isDemandesActive = activePage === "demandes";
  const activeTab = openTabs.find(t => t.id === activePage);

  return (
    <div className="flex flex-col h-screen bg-[#F3F3F3] overflow-hidden"
         style={{ fontFamily: "-apple-system, 'SF Pro', system-ui, BlinkMacSystemFont, sans-serif" }}>
      <GlobalHeader />

      {/* ── Navigation tabs bar ── */}
      <div className="bg-white flex items-center h-10 border-b border-[#e5e5e5] overflow-x-auto">
        {/* App launcher */}
        <button className="flex items-center gap-1 px-3 h-full text-[13px] font-semibold text-[#03234D] shrink-0">
          <Grid3X3 size={14} className="text-[#5C5C5C]" /> PEP
        </button>

        {/* Demandes tableau tab */}
        <button
          onClick={() => setActivePage("demandes")}
          className={`flex items-center gap-1 px-3 h-full text-[13px] shrink-0 ${isDemandesActive ? "text-[#0250D9] font-semibold border-b-[3px] border-[#0250D9]" : "text-[#5C5C5C] hover:text-[#03234D]"}`}
        >
          Demandes tableau <ChevronDown size={12} />
        </button>

        {/* Stagiaires tab */}
        <button
          onClick={() => setActivePage("list")}
          className={`flex items-center gap-1 px-3 h-full text-[13px] shrink-0 ${isListActive ? "text-[#0250D9] font-semibold border-b-[3px] border-[#0250D9]" : "text-[#5C5C5C] hover:text-[#03234D]"}`}
        >
          Stagiaires <ChevronDown size={12} />
        </button>

        {/* Groupes de stagiaires tab */}
        <button
          onClick={() => setActivePage("groupes")}
          className={`flex items-center gap-1 px-3 h-full text-[13px] shrink-0 ${isGroupesActive ? "text-[#0250D9] font-semibold border-b-[3px] border-[#0250D9]" : "text-[#5C5C5C] hover:text-[#03234D]"}`}
        >
          Groupes de stagiaires <ChevronDown size={12} />
        </button>

        {/* Open tabs — persistent until closed (records + groupes) */}
        {openTabs.map(tab => {
          const isActive = activePage === tab.id;
          const tabLabel = tab.label;
          return (
            <button
              key={tab.id}
              onClick={() => setActivePage(tab.id)}
              className={`flex items-center gap-1.5 px-3 h-full text-[13px] shrink-0 group ${isActive ? "text-[#0250D9] font-semibold border-b-[3px] border-[#0250D9]" : "text-[#5C5C5C] hover:text-[#03234D]"}`}
            >
              {tabLabel}
              <CheckIcon size={12} className={isActive ? "text-[#0250D9]" : "text-[#5C5C5C]"} />
              <span
                onClick={(e) => handleCloseTab(e, tab.id)}
                className="ml-0.5 rounded hover:bg-[#F3F3F3] p-0.5 transition-colors"
                title="Fermer cet onglet"
              >
                <XIcon size={12} className={`${isActive ? "text-[#0250D9]" : "text-[#5C5C5C]"} hover:text-[#D1242F]`} />
              </span>
            </button>
          );
        })}
      </div>

      {/* ── Page content ── */}
      {isDemandesActive && <DemandesListViewPage onContactClick={handleNavigateToContact} onDemandeClick={handleNavigateToDemande} />}
      {isListActive && <ListViewPage onNavigateToRecord={handleNavigateToRecord} />}
      {isGroupesActive && <GroupesListViewPage onNavigateToGroupe={handleNavigateToGroupe} />}
      {activeTab && activeTab.type === "record" && <RecordPage row={activeTab.data} />}
      {activeTab && activeTab.type === "formations" && <FormationsPage row={activeTab.data} />}
      {activeTab && activeTab.type === "groupe" && <GroupeRecordPage groupe={activeTab.data} onNavigateToRecord={handleNavigateToRecord} />}
      {activeTab && activeTab.type === "demande" && <DemandeRecordPage demande={activeTab.data} onContactClick={handleNavigateToContact} />}
      {activeTab && activeTab.type === "contact" && <ContactRecordPage demande={activeTab.data} onAccountClick={handleNavigateToAccount} />}
      {activeTab && activeTab.type === "account" && <AccountRecordPage account={activeTab.data} onSocieteClick={handleNavigateToSociete} />}
      {activeTab && activeTab.type === "societe" && <SocieteRecordPage societe={activeTab.data} onAccountClick={handleNavigateToAccount} />}

      <DockedUtilityBar />
    </div>
  );
}


App;

App;


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
(function patchViewerComments() {
  if (window.self === window.top) return;
  var p = window.parent;
  if (!p || typeof p.renderCommentPins !== 'function') {
    return setTimeout(patchViewerComments, 400);
  }
  function getView() {
    try { var h = decodeURIComponent(p.location.hash.slice(1)); var i = h.indexOf('|'); return i >= 0 ? h.slice(i+1) : ''; } catch(e) { return ''; }
  }
  var cv = getView();

  // Interval: stamp any comment without view every 300ms
  setInterval(function() {
    try {
      var changed = false;
      Object.keys(p.commentsDB).forEach(function(k) {
        (p.commentsDB[k]||[]).forEach(function(c) {
          if (c && !('view' in c)) { c.view = cv; changed = true; }
        });
      });
      if (changed && typeof p.saveComments === 'function') p.saveComments();
    } catch(e) {}
  }, 300);

  // pvViewChange: custom event dispatched by writeHash (pushState doesn't fire hashchange)
  try { p.addEventListener('pvViewChange', function(e) { cv = e.detail.view; try { filterPinDOM(); } catch(x) {} p.updateCommentBadge(); }); } catch(e) {}

  // Build a lookup map: comment id → view
  function buildIdMap() {
    var m = {};
    Object.keys(p.commentsDB).forEach(function(k) {
      (p.commentsDB[k]||[]).forEach(function(c) { if (c && c.id) m[c.id] = (c.view||''); });
    });
    return m;
  }

  // After renderCommentPins runs, remove DOM pins that don't belong to current view
  function filterPinDOM() {
    var view = cv;
    var idMap = buildIdMap();
    p.document.querySelectorAll('.comment-pin').forEach(function(el) {
      var id = el.dataset && el.dataset.id;
      if (id !== undefined && idMap[id] !== undefined && idMap[id] !== view) {
        el.style.display = 'none';
      } else if (id !== undefined && idMap[id] === view) {
        el.style.display = '';
      }
    });
  }

  var _origRender = p.renderCommentPins;
  p.renderCommentPins = function() {
    var r = _origRender.apply(this, arguments);
    try { filterPinDOM(); } catch(e) {}
    return r;
  };

  // Badge: count only current-view comments
  var _origBadge = p.updateCommentBadge;
  p.updateCommentBadge = function() {
    var view = cv; var saved = {};
    try {
      Object.keys(p.commentsDB).forEach(function(k) { saved[k] = p.commentsDB[k]; p.commentsDB[k] = p.commentsDB[k].filter(function(c) { return (c.view||'') === view; }); });
      var r = _origBadge.apply(this, arguments);
      Object.keys(saved).forEach(function(k) { p.commentsDB[k] = saved[k]; });
      return r;
    } catch(e) { Object.keys(saved).forEach(function(k) { p.commentsDB[k] = saved[k]; }); return _origBadge.apply(this, arguments); }
  };
  var _orig = p.confirmNewComment;
  p.confirmNewComment = function() {
    var r = _orig.apply(this, arguments);
    try { Object.keys(p.commentsDB).forEach(function(k) { var a = p.commentsDB[k]; if (a && a.length) { var last = a[a.length-1]; if (last && last.view === undefined) { last.view = cv; p.saveComments(); } } }); } catch(e) {}
    return r;
  };
  p.renderCommentPins(); p.updateCommentBadge();
})();
</script>
