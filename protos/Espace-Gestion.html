// ══════════════════════════════════════════════════════════════
// buildRecordData — génère toutes les données d'une fiche
// à partir d'une ligne de STAGIAIRES_LIST
// ══════════════════════════════════════════════════════════════

function buildRecordData(row) {
  const crCode = CR_CODE_MAP[row.cr] || "14";
  const supra = row.numInscription.replace(/-/g, " ");
  const employeurs = EMPLOYEURS_MAP[row.cr] || ["CABINET INCONNU"];
  const maitres = MAITRES_STAGE_MAP[row.cr] || ["M INCONNU"];
  const employeur = employeurs[Math.abs(hashStr(row.stagiaire)) % employeurs.length];
  const ms = maitres[0];
  const msCAC = maitres.length > 1 ? maitres[1] : maitres[0];
  const controleur = maitres.length > 2 ? maitres[2] : maitres[maitres.length - 1];
  const cp = CP_MAP[row.cr] || "75000";
  const annee = parseInt(row.anneeStage) || 1;
  const moisValides = row.statut === "Stage terminé" ? 36 : annee === 3 ? 30 : annee === 2 ? 18 : 8;
  const statutUpper = row.statut === "En exercice" ? "EN EXERCICE" : row.statut === "Stage terminé" ? "STAGE TERMINÉ" : "SUSPENDU";
  const cursusLabel = row.cursusFormation === "2" ? "TRAVAUX 200 HEURES" : "TRAVAUX 200 HEURES";

  // Compute session date (2 months after dateEffet)
  const parts = row.dateEffet.split("/");
  const mEff = parseInt(parts[1]);
  const yEff = parseInt(parts[2]);
  const sessionMonth = mEff + 2 > 12 ? mEff + 2 - 12 : mEff + 2;
  const sessionYear = mEff + 2 > 12 ? yEff + 1 : yEff;
  const sessionDate = `18/${String(sessionMonth).padStart(2,"0")}/${sessionYear}`;

  // ro = readOnly shorthand
  const ro = true;
  const nameParts = row.stagiaire.split(" ");
  const nom = nameParts[0] || "";
  const prenom = nameParts.slice(1).join(" ") || "";

  const anneeLabel = annee === 1 ? "1 an" : annee === 2 ? "2 ans" : "3 ans";
  const highlights = [
    { label: "Stagiaire", value: row.stagiaire, isLink: true },
    { label: "N° Supra", value: supra },
    { label: "Qualité", value: "STAGIAIRE - REGIME 81" },
    { label: "Statut", value: statutUpper },
    { label: "Employeur", value: employeur },
    { label: "Maître de stage", value: ms },
    { label: "Année de stage", value: anneeLabel },
    { label: "Mobile", value: `06 ${String(hashStr(row.stagiaire) % 100).padStart(2,"0")} ${String(hashStr(nom) % 100).padStart(2,"0")} ${String(hashStr(prenom) % 100).padStart(2,"0")} ${String(hashStr(supra) % 100).padStart(2,"0")}` },
    { label: "Mail", value: `${prenom.toLowerCase()}.${nom.toLowerCase()}@gmail.com` },
  ];

  // ═══ ONGLET INDIVIDU ═══

  // Identité (01 Individu - IDENTITE) — 13 éditables, 4 lecture seule
  const identite = [
    [{ label: "Qualité", value: "STAGIAIRE - REGIME 81", readOnly: ro }, { label: "Date inscription", value: row.dateEffet, readOnly: ro }],
    [{ label: "Titre", value: prenom.endsWith("e") || prenom.endsWith("a") ? "MADAME" : "MONSIEUR" }, { label: "Nom d'usage", value: nom }],
    [{ label: "Prénom", value: prenom }, { label: "Nom marital", value: "" }],
    [{ label: "Nom de famille", value: nom }, { label: "Pays de naissance", value: "FRANCE" }],
    [{ label: "Date de naissance", value: `${String(11 + (hashStr(row.stagiaire) % 20)).padStart(2,"0")}/${String(1 + (hashStr(nom) % 12)).padStart(2,"0")}/${1975 + (hashStr(prenom) % 25)}` }, { label: "Département de naissance", value: `0${crCode} ${row.cr.toUpperCase().substring(0,12)}` }],
    [{ label: "Date décès", value: "" }, { label: "Ville de naissance", value: row.cr.toUpperCase().split("-")[0] }],
    [{ label: "DESCF/DSCG complet", value: row.dscg || "Non" }, { label: "Nationalité", value: "FRANCE" }],
    [{ label: "Parution Annuaire OEC", value: "Oui" }, { label: "N° Supra", value: supra, readOnly: ro }],
    [{ label: "Identifiant", value: "" }],
  ];

  // Dossier (01 Individu - DOSSIER) — 6 éditables, 8 lecture seule
  const dossier = [
    [{ label: "Adresse pro.", value: `${row.numInscription} ${employeur}`, readOnly: ro }, { label: "N° Inscription (CR)", value: crCode }],
    [{ label: "N° Inscription (N°)", value: row.numInscription.split("-")[1] || "00000000" }, { label: "N° Inscription (index)", value: "01" }],
    [{ label: "Type d'inscription", value: "PRINCIPAL", readOnly: ro }, { label: "Statut", value: statutUpper, readOnly: ro }],
    [{ label: "Conseil Régional", value: row.cr.toUpperCase(), readOnly: ro }, { label: "Diffusion adresse", value: "Oui" }],
    [{ label: "Adresse Ordinale", value: "Adresse personnelle" }, { label: "Téléphone", value: "FRA" }],
    [{ label: "E-mail", value: `${prenom.toLowerCase()}.${nom.toLowerCase()}@gmail.com` }, { label: "Mobile", value: `FRA 06 ${String(hashStr(row.stagiaire) % 100).padStart(2,"0")} ${String(hashStr(nom) % 100).padStart(2,"0")} ${String(hashStr(prenom) % 100).padStart(2,"0")} ${String(hashStr(supra) % 100).padStart(2,"0")}` }],
  ];

  // Adresses (02 Adresses)
  const adresses = [
    [{ label: "Adresse personnelle", value: `${1 + (hashStr(row.stagiaire) % 50)} RUE ${["RONSARD","VOLTAIRE","HUGO","PASTEUR","CURIE"][hashStr(nom) % 5]}`, readOnly: ro }, { label: "Code postal", value: cp, readOnly: ro }],
    [{ label: "Ville", value: row.cr.toUpperCase().split("-")[0], readOnly: ro }, { label: "Pays", value: "FRANCE", readOnly: ro }],
    [{ label: "Mobile", value: `06 ${String(hashStr(row.stagiaire) % 100).padStart(2,"0")} ${String(hashStr(nom) % 100).padStart(2,"0")} ${String(hashStr(prenom) % 100).padStart(2,"0")} ${String(hashStr(supra) % 100).padStart(2,"0")}` }, { label: "E-mail", value: `${prenom.toLowerCase()}.${nom.toLowerCase()}@gmail.com` }],
    [{ label: "Adresse professionnelle", value: `${employeur} — ${cp}`, readOnly: ro }, { label: "Tél. professionnel", value: `01 ${String(hashStr(employeur) % 100).padStart(2,"0")} ${String(hashStr(cp) % 100).padStart(2,"0")} ${String(hashStr(ms) % 100).padStart(2,"0")} 00`, readOnly: ro }],
  ];

  // Diplômes (03 Diplomes — tableau lecture seule + détail éditable)
  const diplomes = [
    [{ label: "Code", value: "312", readOnly: ro }, { label: "Diplôme", value: row.dscg === "Complet" ? "DSCG" : "DSCG sauf UE 1", readOnly: ro }],
    [{ label: "Année", value: String(yEff - 1), readOnly: ro }, { label: "Justificatifs", value: "Oui", readOnly: ro }],
    [{ label: "Date diplôme", value: "", readOnly: ro }, { label: "Titre du mémoire", value: "", readOnly: ro }],
  ];

  // Diplômes tab — table rows + formulaire détail
  const diplomesTab = [
    { code: "312", diplome: row.dscg === "Complet" ? "DSCG" : "DSCG sauf UE 1", annee: String(yEff - 1), justificatifs: "Oui", dateDiplome: "", titrememoire: "" },
    { code: "313", diplome: "DGC INTEC", annee: String(yEff - 3), justificatifs: "Oui", dateDiplome: `15/09/${yEff - 3}`, titrememoire: "" },
    { code: "314", diplome: "Master CCA", annee: String(yEff - 2), justificatifs: "Oui", dateDiplome: `30/06/${yEff - 2}`, titrememoire: "" },
  ];
  if (annee >= 3) {
    diplomesTab.push({ code: "342", diplome: "DEC (mémoire soutenu)", annee: "", justificatifs: "Non", dateDiplome: "", titrememoire: "" });
  }

  // Mode d'exercice (04 — tableau lecture seule)
  const modeExercice = [
    [{ label: "Année", value: String(yEff), readOnly: ro }, { label: "N° d'inscription", value: row.numInscription, readOnly: ro }],
    [{ label: "Type", value: "Dossier", readOnly: ro }, { label: "CAC sous BNC", value: "", readOnly: ro }],
    [{ label: "EC sous BNC", value: "", readOnly: ro }, { label: "Expertise Judiciaire", value: "Non", readOnly: ro }],
    [{ label: "Activité chez Personne Morale", value: "", readOnly: ro }],
  ];

  // ═══ ONGLET MOTIFS ═══

  const crShort = row.cr.substring(0,3).toUpperCase();
  const reinscrMonth = mEff + 14 > 12 ? ((mEff + 14 - 1) % 12) + 1 : mEff + 14;
  const reinscrYear = mEff + 14 > 12 ? yEff + Math.floor((mEff + 13) / 12) : yEff;
  const reinscrDate = `01/${String(reinscrMonth).padStart(2,"0")}/${reinscrYear}`;
  const reinscrSessionDate = `18/${String(reinscrMonth + 2 > 12 ? reinscrMonth - 10 : reinscrMonth + 2).padStart(2,"0")}/${reinscrMonth + 2 > 12 ? reinscrYear + 1 : reinscrYear}`;

  const motifsHistorique = [
    { cr: crShort, crOrigine: crShort, numInscription: row.numInscription, motif: "INSCRIPTION AU STAGE", type: "D", effet: row.dateEffet, session: sessionDate, decision: "Validé" },
  ];
  // Add REINSCRIPTION for année 2+
  if (annee >= 2) {
    motifsHistorique.push({ cr: crShort, crOrigine: crShort, numInscription: row.numInscription, motif: "REINSCRIPTION", type: "D", effet: reinscrDate, session: reinscrSessionDate, decision: "Validé" });
  }
  // Add SUSPENSION + REPRISE for suspended
  if (row.statut === "Suspendu") {
    const suspDate = `01/${String(mEff + 6 > 12 ? mEff - 6 : mEff + 6).padStart(2,"0")}/${mEff + 6 > 12 ? yEff + 1 : yEff}`;
    motifsHistorique.push({ cr: crShort, crOrigine: crShort, numInscription: row.numInscription, motif: "SUSPENSION", type: "D", effet: suspDate, session: "", decision: "Validé" });
  }
  // Add FIN DE STAGE for terminé
  if (row.statut === "Stage terminé") {
    motifsHistorique.push({ cr: crShort, crOrigine: crShort, numInscription: row.numInscription, motif: "ATTESTATION DE FIN DE STAGE", type: "D", effet: row.dateFin || "", session: "", decision: "Validé" });
  }

  const motifsEnAttente = [];

  // ═══ ONGLET STAGE ═══

  // EN-TETE: 5 champs éditables + ELEMENT EN COURS + NOMBRE DE MOIS: lecture seule
  const stageGeneral = [
    [{ label: "Nb de Mois du Stage", value: "36" }, { label: "Cursus de Formation", value: row.cursusFormation }],
    [{ label: "Année de stage", value: row.anneeStage }, { label: "Stage EC/CAC", value: "Oui" }],
    [{ label: "Réduction", value: "" }, { label: "Date de début", value: row.dateEffet, readOnly: ro }],
    [{ label: "Date de fin", value: row.dateFin || "", readOnly: ro }, { label: "Type de cursus", value: cursusLabel, readOnly: ro }],
    [{ label: "Type de stage", value: "CABINET OU SOCIETE D'EXPERTISE COMPTABLE", readOnly: ro }, { label: "Mois validés", value: String(moisValides), readOnly: ro }],
    [{ label: "Mois invalidés", value: "0", readOnly: ro }, { label: "Mois suspension", value: row.statut === "Suspendu" ? "3" : "0", readOnly: ro }],
    [{ label: "Total", value: String(moisValides), readOnly: ro }, { label: "Durée de stage", value: String(moisValides), readOnly: ro }],
    ...(row.statut === "Suspendu" ? [[{ label: "Situation", value: statutUpper, readOnly: ro }, { label: "Accès E-learning", value: "OUI" }]] : [[{ label: "Situation", value: statutUpper, readOnly: ro }]]),
  ];

  const encadrement = [
    [{ label: "Maître de stage", value: `${crCode}0001${String(hashStr(ms) % 9999).padStart(4,"0")}01  ${ms}`, readOnly: ro }, { label: "Maître de stage CAC", value: msCAC, readOnly: ro }],
    [{ label: "Maître de stage AGC", value: "", readOnly: ro }, { label: "Contrôleur", value: `${crCode}0001${String(hashStr(controleur) % 9999).padStart(4,"0")}01  ${controleur}`, readOnly: ro }],
    [{ label: "CR", value: crCode, readOnly: ro }, { label: "Situation à la date du jour", value: statutUpper, readOnly: ro }],
  ];

  // GROUPES: tout lecture seule
  const groupes = [
    [{ label: "N° Groupe", value: row.groupePrincipal, editable: true }, { label: "An", value: row.anneeStage, readOnly: true }],
    [{ label: "Libellé", value: `${row.groupePrincipal} / ND / ${controleur.split(" ").slice(1).join(" ")}…`, editable: true }, { label: "Rattrapage", value: "Non", readOnly: true }],
    [{ label: "Groupe Principal", value: "Oui", readOnly: true }, { label: "Date de fin", value: row.dateFin || "", readOnly: true }],
  ];

  // PERIODES: tout lecture seule
  const periodes = [
    [{ label: "Début", value: row.dateEffet, readOnly: ro }, { label: "Fin", value: row.dateFin || "(en cours)", readOnly: ro }],
    [{ label: "Durée", value: `${moisValides} mois`, readOnly: ro }, { label: "Type de Stage", value: "CABINET OU SOCIETE D'EXPERTISE COMPTABLE", readOnly: ro }],
    [{ label: "Maître de Stage", value: ms, readOnly: ro }, { label: "Commentaire", value: "", readOnly: ro }],
  ];

  // EMPLOYEURS: tout lecture seule
  const employeurFields = [
    [{ label: "Conseil", value: crCode, readOnly: ro }, { label: "N° supra", value: `${crCode}0002${String(hashStr(employeur) % 9999).padStart(4,"0")}01`, readOnly: ro }],
    [{ label: "N° inscription", value: `${crCode}0002${String(hashStr(employeur) % 9999).padStart(4,"0")}01`, readOnly: ro }, { label: "Effet", value: row.dateEffet, readOnly: ro }],
    [{ label: "Fin", value: "", readOnly: ro }, { label: "Dénomination", value: employeur, readOnly: ro }],
    [{ label: "Qualité", value: "SEC", readOnly: ro }, { label: "CP", value: cp, readOnly: ro }],
  ];

  // ATTESTATION (12 Stage > Attestation) — arbre de synthèse + formulaire
  const hCAC = annee === 1 ? 0 : annee === 2 ? 32 : 64;
  const hSemCAC = 0;
  const hEC = annee === 1 ? 800 : annee === 2 ? 1600 : 2188;
  const moisSusp = row.statut === "Suspendu" ? 3 : 0;
  const ctrlNum = `${crCode}0001${String(hashStr(controleur) % 9999).padStart(4,"0")}01`;
  const ficheCount = annee;
  const rapportCount = annee * 2;

  const attestation = {
    // 1. Fiches travaux professionnels
    travauxPro: {
      titre: "Fiches travaux professionnels - Commissariat aux comptes",
      heuresCAC: `${hCAC} h`,
      heuresSeminaireCAC: `${hSemCAC} h`,
      heuresEC: `${hEC} h`,
    },
    // 2. Nombre de mois de stage
    moisStage: {
      dateReference: "24/03/2026",
      moisValides: String(moisValides),
      moisNonValides: "0",
      moisSuspendus: String(moisSusp),
      periode: `(${row.dateEffet} - ${row.dateFin || "?"}) ${moisValides} mois validés ~ N° ${ctrlNum}`,
    },
    // 3. Fiches Contrôleurs de stage
    fichesControleurs: Array.from({ length: ficheCount }, (_, i) => ({
      label: `Fiche ${i + 1}`,
      date: `31/01/${yEff + i + 1}`,
    })),
    // 4. Rapports semestriels
    rapports: Array.from({ length: rapportCount }, (_, i) => {
      const mOffset = i % 2 === 0 ? 7 : 1;
      const yOffset = Math.floor((i + 1) / 2) + (i % 2 === 0 ? 0 : 1);
      return { label: `Rapport DIVERS ${Math.floor(i / 2) + 1}`, date: `${mOffset === 7 ? "31/07" : "31/01"}/${yEff + yOffset}` };
    }),
    // 5. Fiches de suivi des Formations
    fichesSuiviFormations: Array.from({ length: ficheCount }, (_, i) => ({
      label: `Fiche ${i + 1}`,
      date: `31/01/${yEff + i + 1}`,
    })),
    // 6. Fiche entretien 2ème année
    ficheEntretien: annee >= 2,
    // 7. Formations (summary count)
    formationsCount: annee === 1 ? 3 : annee === 2 ? 5 : 7,
    // 8. Solde des cotisations
    soldeCotisations: "0.00 €",
    // FORMULAIRE ATTESTATION
    formulaire: {
      dateAttestation: "",
      dateFinStage: "",
      dateEdition: "",
    },
    // INSCRIPTION REUNION COMITE REGIONAL
    comiteRegional: {
      date: "",
      validationCRS: "",
    },
    // AUTRES CHAMPS
    autres: {
      commentaire: "",
      conformiteCRCC: "",
      ficheSynthese: "",
    },
  };

  // OBLIGATIONS — rapports semestriels + fiches travaux professionnels
  const TODAY_Y = 2026; const TODAY_M = 4;
  const completedRapports = Math.max(0, (annee - 1) * 2);
  const completedFiches   = Math.max(0, annee - 1);

  const rapportItems = Array.from({ length: rapportCount }, (_, i) => {
    const semM = i % 2 === 0 ? 7 : 1;
    const yOff = Math.floor(i / 2) + (i % 2 === 0 ? 0 : 1);
    const echeanceY = yEff + yOff;
    const echeance = `31/${String(semM).padStart(2,"0")}/${echeanceY}`;
    const received = i < completedRapports;
    const isPast = echeanceY < TODAY_Y || (echeanceY === TODAY_Y && semM < TODAY_M);
    const statut = received ? "recu" : isPast ? "retard" : "attente";
    const recuM = semM === 7 ? 8 : 2;
    const recuY = semM === 7 ? echeanceY : echeanceY + 1;
    const recuLe = received ? `${String(10 + (i * 5) % 18).padStart(2,"0")}/${String(recuM).padStart(2,"0")}/${recuY}` : null;
    const retardAns = statut === "retard" ? Math.max(1, TODAY_Y - echeanceY) : 0;
    return { num: i + 1, echeance, statut, recuLe, retardAns };
  });

  const ficheItems = Array.from({ length: ficheCount }, (_, i) => {
    const echeanceY = yEff + i + 1;
    const echeance = `31/01/${echeanceY}`;
    const received = i < completedFiches;
    const isPast = echeanceY < TODAY_Y || (echeanceY === TODAY_Y && 1 < TODAY_M);
    const statut = received ? "recu" : isPast ? "retard" : "attente";
    const recuLe = received ? `${String(15 + (i * 7) % 12).padStart(2,"0")}/10/${echeanceY}` : null;
    const retardAns = statut === "retard" ? Math.max(1, TODAY_Y - echeanceY) : 0;
    return { num: i + 1, echeance, statut, recuLe, retardAns };
  });

  const obligations = { rapports: rapportItems, fiches: ficheItems };

  // Formations: toutes les formations des 3 cycles, statut selon l'avancement
  const completedCount = annee === 1 ? 3 : annee === 2 ? 9 : 16;
  const inProgressIdx = completedCount; // index de la formation "En cours"
  const baseDatesAll = [
    // Cycle 1
    ["10/02", "15/03"], ["05/04", "20/05"], ["01/06", "18/06"],
    ["25/08", "12/09"], ["01/10", "15/10"], ["08/11", ""], ["05/12", ""],
    // Cycle 2
    ["15/01", "20/02"], ["10/03", "15/04"], ["05/05", "10/06"],
    ["25/08", "10/09"], ["15/10", ""], ["20/11", ""],
    // Cycle 3
    ["20/01", "25/02"], ["10/03", "15/04"], ["15/04", "20/05"],
    ["05/06", "25/06"], ["15/09", ""], ["15/11", ""],
  ];
  const formations = ALL_FORMATIONS.map((f, i) => {
    const completed = i < completedCount;
    const inProgress = i === inProgressIdx;
    const yearOffset = f.cycle - 1;
    const bd = baseDatesAll[i] || ["01/01", ""];
    const futureCycle = f.cycle > annee;
    const dates = f.formats.length === 2
      ? [{ fmt: "E-learning", date: futureCycle ? "" : `${bd[0]}/${yEff + yearOffset}` }, { fmt: "Présentiel", date: futureCycle ? "" : `${bd[1]}/${yEff + yearOffset}` }]
      : [{ fmt: "Présentiel", date: futureCycle ? "" : `${bd[0]}/${yEff + yearOffset}` }];
    return {
      ...f,
      dates,
      statut: futureCycle ? "À venir" : completed ? "Validée" : inProgress ? "En cours" : "À venir",
    };
  });

  return { highlights, identite, dossier, adresses, diplomes, modeExercice, motifsHistorique, motifsEnAttente, stageGeneral, encadrement, groupes, periodes, employeurFields, obligations, formations, attestation, diplomesTab };
}

// Simple deterministic hash for consistent data generation
function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

                          onClick={() => { setEditingNumero(true); setEditingLibelle(false); }}
                        >
                          <span className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] truncate">{currentNumero || "\u00A0"}</span>
                          <Pencil size={14} className="text-[#5C5C5C] shrink-0 opacity-60" />
                        </div>
                      )}
                    </div>
                  );
                }
                // Libellé — editable with dropdown
                if (field.label === "Libellé") {
                  return (
                    <div key={fi} className="flex-1 pl-1 pb-1 relative">
                      <p className="text-[13px] text-[#5C5C5C] leading-[18px]">{field.label}</p>
                      {editingLibelle ? (
                        <div>
                          <div className="flex items-center gap-1 border-b-2 border-[#0250D9] min-h-[24px] pb-1 pt-0.5">
                            <input
                              autoFocus
                              className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] bg-transparent outline-none"
                              placeholder="Rechercher par libellé…"
                              value={searchLibelle}
                              onChange={(e) => setSearchLibelle(e.target.value)}
                              onKeyDown={(e) => { if (e.key === "Escape") { setEditingLibelle(false); setSearchLibelle(""); } }}
                            />
                          </div>
                          <div className="absolute left-0 right-0 z-50 mt-1 bg-white border border-[#C9C9C9] rounded-lg shadow-lg max-h-[200px] overflow-y-auto">
                            {filteredByLibelle.length === 0 && (
                              <div className="px-3 py-2 text-[12px] text-[#5C5C5C] italic">Aucun groupe trouvé</div>
                            )}
                            {filteredByLibelle.map((g, gi) => (
                              <button
                                key={gi}
                                className="w-full text-left px-3 py-2 hover:bg-[#F3F3F3] transition-colors flex items-center gap-3 border-b border-[#F3F3F3] last:border-0"
                                onClick={() => applyGroupe(g)}
                              >
                                <span className="text-[13px] text-[#03234D] font-medium truncate">{g.libelle}</span>
                                <span className="text-[12px] text-[#5C5C5C] w-[60px] shrink-0 text-right">{g.numero}</span>
                              </button>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div
                          className="flex items-center gap-1 border-b border-[#C9C9C9] min-h-[24px] pb-1 pt-0.5 hover:border-[#0250D9] transition-colors cursor-pointer"
                          onClick={() => { setEditingLibelle(true); setEditingNumero(false); }}
                        >
                          <span className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] truncate">{currentLibelle || "\u00A0"}</span>
                          <Pencil size={14} className="text-[#5C5C5C] shrink-0 opacity-60" />
                        </div>
                      )}
                    </div>
                  );
                }
                // Read-only fields — same rendering as EditableField readOnly
                return (
                  <div key={fi} className="flex-1 pl-1 pb-1">
                    <p className="text-[13px] text-[#5C5C5C] leading-[18px]">{field.label}</p>
                    <div className="flex items-center gap-1 border-b border-transparent min-h-[24px] pb-1 pt-0.5">
                      <span className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] truncate">
                        {field.value || "\u00A0"}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function EditableField({ label, value, onChange, readOnly, isLink, onClick }) {
  const [editing, setEditing] = useState(false);
  const [localVal, setLocalVal] = useState(value);
  const commit = () => { setEditing(false); if (onChange) onChange(localVal); };

  // Read-only mode: no pencil, no click-to-edit, no hover border change
  if (readOnly) {
    return (
      <div className="flex-1 pl-1 pb-1">
        <p className="text-[13px] text-[#5C5C5C] leading-[18px]">{label}</p>
        <div className="flex items-center gap-1 border-b border-transparent min-h-[24px] pb-1 pt-0.5">
          {isLink
            ? <span onClick={onClick} className="flex-1 text-[13px] text-[#0250D9] leading-[18px] truncate cursor-pointer hover:underline">{value || "\u00A0"}</span>
            : <span className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] truncate">{value || "\u00A0"}</span>
          }
        </div>
      </div>
    );
  }

  if (editing) {
    return (
      <div className="flex-1 pl-1 pb-1">
        <p className="text-[13px] text-[#5C5C5C] leading-[18px]">{label}</p>
        <div className="flex items-center gap-1 border-b-2 border-[#0250D9] min-h-[24px] pb-1 pt-0.5">
          <input
            autoFocus
            className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] bg-transparent outline-none"
            value={localVal}
            onChange={(e) => setLocalVal(e.target.value)}
            onBlur={commit}
            onKeyDown={(e) => { if (e.key === "Enter") commit(); if (e.key === "Escape") { setLocalVal(value); setEditing(false); } }}
          />
        </div>
      </div>
    );
  }
  return (
    <div className="flex-1 pl-1 pb-1 cursor-pointer" onClick={() => setEditing(true)}>
      <p className="text-[13px] text-[#5C5C5C] leading-[18px]">{label}</p>
      <div className="flex items-center gap-1 border-b border-[#C9C9C9] min-h-[24px] pb-1 pt-0.5 hover:border-[#0250D9] transition-colors">
        <span className="flex-1 text-[13px] text-[#2E2E2E] leading-[18px] truncate">
          {value || "\u00A0"}
        </span>
        <Pencil size={14} className="text-[#5C5C5C] shrink-0 opacity-60" />
      </div>
    </div>
  );
}

function ObligationsPanel({ data }) {
  const { rapports, fiches } = data;
  const [sortField, setSortField] = useState(null);
  const [sortDir, setSortDir]   = useState("asc");

  const handleSort = (field) => {
    if (sortField === field) { setSortDir(d => d === "asc" ? "desc" : "asc"); }
    else { setSortField(field); setSortDir("asc"); }
  };

  // Flatten rapports + fiches into one list
  const rows = [
    ...rapports.map(r => ({ ...r, categorie: "Rapport semestriel",       label: `Rapport n°${r.num}` })),
    ...fiches.map(f   => ({ ...f, categorie: "Fiche travaux prof.",       label: `Fiche n°${f.num}`   })),
  ];

  const statutOrder = { "recu": 1, "attente": 2, "retard": 3 };
  const sorted = [...rows].sort((a, b) => {
    if (!sortField) return 0;
    let av, bv;
    if (sortField === "statut")    { av = statutOrder[a.statut] || 5; bv = statutOrder[b.statut] || 5; }
    else if (sortField === "date") { av = a.echeance.split("/").reverse().join(""); bv = b.echeance.split("/").reverse().join(""); }
    else                           { av = (a[sortField] || "").toLowerCase(); bv = (b[sortField] || "").toLowerCase(); }
    if (av < bv) return sortDir === "asc" ? -1 : 1;
    if (av > bv) return sortDir === "asc" ?  1 : -1;
    return 0;
  });

  const SortIcon = ({ field }) => {
    const active = sortField === field;
    const col = active ? "#0250D9" : "#C4C9D4";
    if (active && sortDir === "desc") return <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round"><path d="M12 19V5M5 12l7 7 7-7"/></svg>;
    return <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12l7-7 7 7"/></svg>;
  };

  const thBase = "px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider bg-[#FAFBFC] select-none cursor-pointer hover:text-[#0250D9] transition-colors";
  const thTh = (field, style, label) => (
    <th className={thBase} style={{ color: sortField === field ? "#0250D9" : "#9AA3B2", ...style }} onClick={() => handleSort(field)}>
      <span className="inline-flex items-center gap-1">{label}<SortIcon field={field} /></span>
    </th>
  );

  return (
    <div className="overflow-x-auto">
      <table className="w-full border-collapse">
        <thead>
          <tr className="border-b border-[#EEF0F5]">
            {thTh("label",      { width: "150px" }, "Obligation")}
            {thTh("categorie",  { width: "180px" }, "Type")}
            {thTh("date",       { width: "120px" }, "Échéance")}
            {thTh("statut",     { width: "200px" }, "Statut")}
            <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider bg-[#FAFBFC] text-[#9AA3B2]">Note</th>
          </tr>
        </thead>
        <tbody>
          {sorted.map((row, i) => {
            const isRecu   = row.statut === "recu";
            const isRetard = row.statut === "retard";
            return (
              <tr key={i} className="hover:bg-[#F8FAFC] transition-colors">
                <td className="px-3 py-2.5 border-b border-[#EEF0F5]">
                  <span className="text-[13px] font-medium text-[#1B324F]">{row.label}</span>
                </td>
                <td className="px-3 py-2.5 border-b border-[#EEF0F5]">
                  <span className="text-[12px] text-[#5C5C5C]">{row.categorie}</span>
                </td>
                <td className="px-3 py-2.5 border-b border-[#EEF0F5] whitespace-nowrap">
                  <span className="flex items-center gap-1 text-[12px] text-[#5A6478]">
                    <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="#9AA3B2" strokeWidth="1.8" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    {row.echeance}
                  </span>
                </td>
                <td className="px-3 py-2.5 border-b border-[#EEF0F5]">
                  {isRecu
                    ? <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#D6F5E3] text-[#1A7A45] whitespace-nowrap tracking-wide">
                        <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>
                        REÇU LE {row.recuLe}
                      </span>
                    : <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#FEE8DC] text-[#B05E0A] whitespace-nowrap tracking-wide">
                        <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        EN ATTENTE D'ENVOI
                      </span>
                  }
                </td>
                <td className="px-3 py-2.5 border-b border-[#EEF0F5] whitespace-nowrap">
                  {isRecu   && <span className="text-[12px] text-[#9AA3B2] italic">Envoyé et accepté (ARCHIVE)</span>}
                  {isRetard && <span className="text-[12px] text-[#C8102E] italic font-medium">En retard de {row.retardAns} an{row.retardAns > 1 ? "s" : ""}</span>}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

function FormationsTable({ data }) {
  const [sortField, setSortField] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [showAll, setShowAll] = useState(false);
  const PREVIEW = 3;

  const handleSort = (field) => {
    if (sortField === field) {
      setSortDir(d => d === "asc" ? "desc" : "asc");
    } else {
      setSortField(field);
      setSortDir("asc");
    }
  };

  const statutOrder = { "Validée": 1, "En cours": 2, "À venir": 3, "Invalidée": 4 };

  const sorted = [...data].sort((a, b) => {
    if (!sortField) return 0;
    let av, bv;
    if (sortField === "statut") { av = statutOrder[a.statut] || 5; bv = statutOrder[b.statut] || 5; }
    else if (sortField === "cycle") { av = a.cycle; bv = b.cycle; }
    else { av = (a[sortField] || "").toLowerCase(); bv = (b[sortField] || "").toLowerCase(); }
    if (av < bv) return sortDir === "asc" ? -1 : 1;
    if (av > bv) return sortDir === "asc" ? 1 : -1;
    return 0;
  });

  const SortIcon = ({ field }) => {
    const active = sortField === field;
    const col = active ? "#0250D9" : "#C4C9D4";
    if (active && sortDir === "desc") return <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round"><path d="M12 19V5M5 12l7 7 7-7"/></svg>;
    return <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke={col} strokeWidth="2.5" strokeLinecap="round"><path d="M12 5v14M5 12l7-7 7 7"/></svg>;
  };

  const statutStyle = (s) => {
    if (s === "Validée") return "bg-[#E6F4ED] text-[#1A7A45]";
    if (s === "En cours") return "bg-[#FEF4E7] text-[#B05E0A]";
    if (s === "À venir") return "bg-[#FEF3E2] text-[#B05E0A]";
    if (s === "Invalidée") return "bg-[#FDE8EA] text-[#C8102E]";
    return "bg-[#F3F3F3] text-[#5C5C5C]";
  };

  const statutIcon = (s) => {
    if (s === "Validée") return <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>;
    if (s === "En cours") return <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>;
    if (s === "À venir") return <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>;
    return null;
  };

  const thBase = "px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider bg-[#FAFBFC] select-none";
  const thSort = thBase + " cursor-pointer hover:text-[#0250D9] transition-colors";
  const thPlain = thBase + " text-[#9AA3B2]";

  const ThSort = ({ field, style, children }) => (
    <th className={thSort} style={{ color: sortField === field ? "#0250D9" : "#9AA3B2", ...style }} onClick={() => handleSort(field)}>
      <span className="inline-flex items-center gap-1">{children}<SortIcon field={field} /></span>
    </th>
  );

  return (
    <div className="overflow-x-auto">
      <table className="w-full border-collapse">
        <thead>
          <tr className="border-b border-[#EEF0F5]">
            <ThSort field="ref" style={{width:"75px"}}>CFPC</ThSort>
            <ThSort field="cycle" style={{width:"85px"}}>Cycle</ThSort>
            <ThSort field="intitule">Titre</ThSort>
            <th className={thPlain} style={{width:"115px"}}>Format</th>
            <th className={thPlain} style={{width:"90px"}}>Date</th>
            <ThSort field="statut" style={{width:"105px"}}>Statut</ThSort>
          </tr>
        </thead>
        <tbody>
          {(showAll ? sorted : sorted.slice(0, PREVIEW)).map((row, i) => (
            <tr key={i} className="hover:bg-[#F8FAFC] transition-colors">
              <td className="px-3 py-2.5 border-b border-[#EEF0F5] align-top">
                <span className="text-[13px] font-medium text-[#1B324F]">{row.ref}</span>
              </td>
              <td className="px-3 py-2.5 border-b border-[#EEF0F5] align-top whitespace-nowrap">
                <span className="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#EEF3FB] text-[#0250D9] whitespace-nowrap">Cycle {row.cycle}</span>
              </td>
              <td className="px-3 py-2.5 border-b border-[#EEF0F5] align-top">
                <span className="text-[13px] text-[#1B324F]">{row.intitule}</span>
              </td>
              <td className="px-3 py-2.5 border-b border-[#EEF0F5] align-top">
                <div className="flex flex-col gap-1">
                  {row.dates.map((d, di) => (
                    <span key={di} className={`inline-flex items-center gap-1 text-[12px] font-medium whitespace-nowrap ${d.fmt === "E-learning" ? "text-[#2B5BA8]" : "text-[#9B3A2E]"}`}>
                      {d.fmt === "E-learning"
                        ? <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                        : <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>}
                      {d.fmt === "E-learning" ? "E-learning" : "Présentiel"}
                    </span>
                  ))}
                </div>
              </td>
              <td className="px-3 py-2.5 border-b border-[#EEF0F5] align-top">
                <div className="flex flex-col gap-1">
                  {row.dates.map((d, di) => (
                    <span key={di} className="text-[12px] text-[#5A6478] whitespace-nowrap">{d.date}</span>
                  ))}
                </div>
              </td>
              <td className="px-3 py-2.5 border-b border-[#EEF0F5] align-top">
                <div className="flex flex-col gap-1">
                  {row.dates.map((d, di) => (
                    <span key={di} className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap ${statutStyle(row.statut)}`}>
                      {statutIcon(row.statut)}
                      {row.statut}
                    </span>
                  ))}
                </div>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      {sorted.length > PREVIEW && (
        <div className="flex justify-center pt-2 pb-1">
          <button
            onClick={() => setShowAll(v => !v)}
            className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full border border-[#D0D5DD] text-[12px] font-medium text-[#5C5C5C] bg-white hover:bg-[#F3F3F3] hover:text-[#0250D9] hover:border-[#0250D9] transition-colors"
          >
            {showAll
              ? <><svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M18 15l-6-6-6 6"/></svg>Réduire</>
              : <><svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M6 9l6 6 6-6"/></svg>Afficher tout ({sorted.length - PREVIEW} de plus)</>
            }
          </button>
        </div>
      )}
    </div>
  );
}

function AttestationTreeNode({ number, title, children, defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="border-b border-[#E5E5E5] last:border-b-0">

        {open ? <ChevronDown size={12} className="text-[#5C5C5C] shrink-0" /> : <ChevronRight size={12} className="text-[#5C5C5C] shrink-0" />}

        <span className="text-[13px] text-[#03234D] font-medium">{title}</span>
      </button>
      {open && <div className="px-3 pb-3 pt-0">{children}</div>}

  );
}

function AttestationKV({ label, value, muted }) {

}

function DiplomesTab({ data }) {
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [rows, setRows] = useState(data);
  const selected = selectedIdx !== null ? rows[selectedIdx] : null;

  const updateField = (key, val) => {
    setRows(prev => prev.map((r, i) => i === selectedIdx ? { ...r, [key]: val } : r));
  };

  const thCls = "px-3 py-2 text-left text-[12px] font-semibold text-[#03234D] leading-[16px] whitespace-nowrap border-b border-[#C9C9C9]";
  const tdCls = "px-3 py-2 text-[13px] text-[#2E2E2E] leading-[18px]";
  const inputCls = "w-full h-8 px-2 text-[13px] border border-[#C9C9C9] rounded-md focus:border-[#0250D9] focus:ring-1 focus:ring-[#0250D9] outline-none";

  return (
    <div className="mt-3">
      {/* TABLEAU */}
      <div className="bg-white rounded-[8px] border border-[#C9C9C9] overflow-hidden">
        <div className="px-4 py-2.5 flex items-center justify-between">
          <span className="text-[14px] font-semibold text-[#03234D]">Diplômes ({rows.length})</span>
        </div>
        <table className="w-full text-[13px] border-collapse">
          <thead>
            <tr className="bg-[#F3F3F3]">
              <th className={thCls} style={{ width: "60px" }}>Code</th>
              <th className={thCls}>Diplôme</th>
              <th className={thCls} style={{ width: "65px" }}>Année</th>
              <th className={thCls} style={{ width: "90px" }}>Justificatifs</th>
              <th className={thCls} style={{ width: "110px" }}>Date diplôme</th>
              <th className={thCls}>Titre du mémoire</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((d, i) => (
              <tr
                key={i}
                onClick={() => setSelectedIdx(selectedIdx === i ? null : i)}
                className={`border-b border-[#E5E5E5] cursor-pointer transition-colors ${selectedIdx === i ? "bg-[#E8F0FE]" : "hover:bg-[#F9F9F9]"}`}
              >
                <td className={tdCls}>{d.code}</td>
                <td className={tdCls + " font-medium"}>{d.diplome}</td>
                <td className={tdCls}>{d.annee}</td>
                <td className={tdCls}>{d.justificatifs}</td>
                <td className={tdCls}>{d.dateDiplome}</td>
                <td className={tdCls + " text-[#5C5C5C] italic"}>{d.titrememoire || "—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* FORMULAIRE DETAIL */}
      {selected && (
        <div className="mt-3 bg-white rounded-[8px] border border-[#C9C9C9] overflow-hidden">
          <div className="px-4 py-2.5 bg-[#F3F3F3] border-b border-[#C9C9C9] flex items-center justify-between">
            <span className="text-[14px] font-semibold text-[#03234D]">Détail — {selected.diplome}</span>
            <button onClick={() => setSelectedIdx(null)} className="text-[12px] text-[#5C5C5C] hover:text-[#03234D]">Fermer</button>
          </div>
          <div className="p-4 grid grid-cols-2 gap-x-4 gap-y-3">
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Diplôme</label>
              <select value={selected.diplome} onChange={e => updateField("diplome", e.target.value)} className={inputCls + " bg-white"}>
                <option value="DSCG">DSCG</option>
                <option value="DSCG sauf UE 1">DSCG sauf UE 1</option>
                <option value="DGC INTEC">DGC INTEC</option>
                <option value="Master CCA">Master CCA</option>
                <option value="DEC (mémoire soutenu)">DEC (mémoire soutenu)</option>
                <option value="DCG">DCG</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Année Obtention</label>
              <input type="text" value={selected.annee} onChange={e => updateField("annee", e.target.value)} className={inputCls} />
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Justificatifs</label>
              <div className="flex items-center gap-4 h-8">
                <label className="flex items-center gap-1.5 text-[13px] text-[#2E2E2E] cursor-pointer">
                  <input type="radio" name="justif" checked={selected.justificatifs === "Oui"} onChange={() => updateField("justificatifs", "Oui")} className="accent-[#0250D9]" />
                  Oui
                </label>
                <label className="flex items-center gap-1.5 text-[13px] text-[#2E2E2E] cursor-pointer">
                  <input type="radio" name="justif" checked={selected.justificatifs === "Non"} onChange={() => updateField("justificatifs", "Non")} className="accent-[#0250D9]" />
                  Non
                </label>
              </div>
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Date diplôme</label>
              <input type="text" placeholder="jj/mm/aaaa" value={selected.dateDiplome} onChange={e => updateField("dateDiplome", e.target.value)} className={inputCls} />
            </div>
            <div className="col-span-2">
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Titre du mémoire</label>
              <input type="text" value={selected.titrememoire} onChange={e => updateField("titrememoire", e.target.value)} className={inputCls} placeholder="Saisir le titre du mémoire…" />
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Date de session de soutenance</label>
              <input type="text" placeholder="jj/mm/aaaa" className={inputCls} />
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">1ère note obtenue</label>
              <input type="text" placeholder="" className={inputCls} />
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">2ème note obtenue</label>
              <input type="text" placeholder="" className={inputCls} />
            </div>
            <div>
              <label className="block text-[12px] text-[#5C5C5C] mb-1">3ème note obtenue</label>
              <input type="text" placeholder="" className={inputCls} />
            </div>
            <div className="col-span-2">
              <label className="block text-[12px] text-[#5C5C5C] mb-1">Commentaire</label>
              <textarea rows={2} className={"w-full px-2 py-1.5 text-[13px] border border-[#C9C9C9] rounded-md focus:border-[#0250D9] focus:ring-1 focus:ring-[#0250D9] outline-none resize-none"} placeholder="Saisir un commentaire…" />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// FORMATIONS PAGE — vue dédiée formations d'un stagiaire
// Header identique à RecordPage, titre = "Formations"
// ══════════════════════════════════════════════════════════════
function FormationsPage({ row }) {
  const data = buildRecordData(row);
  const [filterStatut, setFilterStatut] = useState("Tous");
  const [filterFormat, setFilterFormat] = useState("Tous");

  const statuts = ["Tous", "Validée", "En cours", "À venir", "Invalidée"];
  const formats = ["Tous", "E-learning", "Présentiel"];

  const filtered = data.formations
    .filter(f => {
      const statutOk = filterStatut === "Tous" || f.statut === filterStatut;
      const formatOk = filterFormat === "Tous" || f.dates.some(d => d.fmt === filterFormat);
      return statutOk && formatOk;
    })
    .map(f => ({
      ...f,
      dates: filterFormat === "Tous" ? f.dates : f.dates.filter(d => d.fmt === filterFormat),
    }));

  const chipBase = "px-3 py-1 rounded-full text-[12px] font-medium border transition-colors cursor-pointer whitespace-nowrap";
  const chipActive = "bg-[#03234D] text-white border-[#03234D]";
  const chipInactive = "bg-white text-[#5C5C5C] border-[#C9C9C9] hover:border-[#03234D] hover:text-[#03234D]";

  return (
    <>
      <div className="bg-[#F3F3F3] px-4 py-4">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-8 h-8 rounded bg-[#FF5D2D] flex items-center justify-center">
              <GraduationCap size={16} className="text-white" />
            </div>
            <div>
              <p className="text-[13px] text-[#5C5C5C] leading-[18px]">Stagiaire</p>
              <p className="text-[28px] text-[#03234D] leading-[35px]">Formations</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="flex border border-[#5C5C5C] rounded-full overflow-hidden">
              <button className="px-4 h-8 text-[14px] text-[#0250D9] bg-white border-r border-[#5C5C5C]">Modifier</button>
              <button className="px-4 h-8 text-[14px] text-[#0250D9] bg-white">Supprimer</button>
            </div>
          </div>
        </div>
      </div>
      <HighlightsPanel fields={data.highlights} />
      <div className="flex-1 overflow-auto px-4 pt-4">
        <div className="max-w-[1408px]">
          <div className="bg-white rounded-[20px] overflow-hidden">
            {/* Header + filtres */}
            <div className="px-4 py-3 border-b border-[#F3F3F3]">
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2">
                  <div className="w-6 h-6 rounded bg-[#FF5D2D] flex items-center justify-center">
                    <GraduationCap size={12} className="text-white" />
                  </div>
                  <span className="text-[16px] font-semibold text-[#03234D]">Formations</span>
                  <span className="text-[13px] text-[#5C5C5C]">({filtered.length} / {data.formations.length})</span>
                </div>
              </div>
              {/* Filtres Statut */}
              <div className="flex items-center gap-2 flex-wrap mb-2">
                <span className="text-[12px] text-[#5C5C5C] font-medium w-[52px]">Statut</span>
                {statuts.map(s => (
                  <button key={s} onClick={() => setFilterStatut(s)} className={`${chipBase} ${filterStatut === s ? chipActive : chipInactive}`}>{s}</button>
                ))}
              </div>
              {/* Filtres Format */}
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[12px] text-[#5C5C5C] font-medium w-[52px]">Format</span>
                {formats.map(f => (
                  <button key={f} onClick={() => setFilterFormat(f)} className={`${chipBase} ${filterFormat === f ? chipActive : chipInactive}`}>{f}</button>
                ))}
              </div>
            </div>
            <FormationsTable data={filtered} />
          </div>
        </div>
      </div>
    </>
  );
}

                {/* ═══ ONGLET FORMATIONS ═══ */}

}

// MODALE — Nouveau groupe (design Figma)
// ══════════════════════════════════════════════════════════════

const CRO_OPTIONS = [
  "Île-de-France", "Hauts-de-France", "Grand-Est", "Normandie", "Bretagne",
  "Auvergne-Rhône-Alpes", "Pays de la Loire", "Centre-Val de Loire",
  "Bourgogne-Franche-Comté", "Nouvelle Aquitaine", "Occitanie",
  "Provence-Alpes-Côte d'Azur", "Corse",
];

const ANNEE_OPTIONS = ["1", "2", "3"];

function NouveauGroupeModal({ onClose, onSave }) {
  const today = new Date();
  const dd = String(today.getDate()).padStart(2, "0");
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const yyyy = today.getFullYear();

  const [form, setForm] = useState({
    cro: "Île-de-France",
    numero: String(26000 + Math.floor(Math.random() * 999)),
    libelle: "",
    annee: "",
    dateConstitution: `${dd}/${mm}/${yyyy}`,
    dateFin: "",
  });

  const set = (key, val) => setForm(prev => ({ ...prev, [key]: val }));

  const canSave = form.libelle.trim() && form.annee;

  const handleSave = () => {
    if (!canSave) return;
    onSave({
      cro: form.cro,
      numero: form.numero,
      annee: form.annee,
      libelle: form.libelle.trim(),
      rattrapage: "N",
      controleur: "",
      dateConstitution: form.dateConstitution,
      dateFin: form.dateFin,
    });
  };

  const labelCls = "block text-[13px] text-[#03234D] mb-1";
  const requiredDot = <span className="text-[#D1242F]">*</span>;
  const inputCls = "w-full border border-[#C9C9C9] rounded px-3 h-10 text-[14px] text-[#2E2E2E] outline-none focus:border-[#0250D9] bg-white";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(0,0,0,0.45)" }}>
      <div className="bg-white rounded-lg shadow-2xl relative" style={{ width: 640 }}>
        {/* Close button (red circle top-right) */}
        <button
          onClick={onClose}
          className="absolute -top-3 -right-3 w-8 h-8 rounded-full bg-[#D1242F] flex items-center justify-center shadow-lg hover:bg-[#B91C1C] transition-colors z-10"
        >
          <XIcon size={14} className="text-white" />
        </button>

        {/* Title */}
        <div className="px-8 pt-6 pb-2">
          <h2 className="text-[20px] font-semibold text-[#03234D] text-center">Nouveau groupe</h2>
          <p className="text-[12px] text-[#D1242F] text-right mt-1">{requiredDot}Informations requises</p>
        </div>

        {/* Form */}
        <div className="px-8 pb-2">
          {/* Row 1: Conseil régional + N° Groupe */}
          <div className="grid grid-cols-2 gap-6 mb-5">
            <div>
              <label className={labelCls}>Conseil régional</label>
              <select
                value={form.cro}
                onChange={e => set("cro", e.target.value)}
                className={inputCls}
              >
                {CRO_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label className={labelCls}>N° Groupe</label>
              <input type="text" value={form.numero} onChange={e => set("numero", e.target.value)} className={inputCls + " bg-[#F3F3F3]"} readOnly />
            </div>
          </div>

          {/* Row 2: Libellé + Année */}
          <div className="grid grid-cols-2 gap-6 mb-5">
            <div>
              <label className={labelCls}>{requiredDot}Libellé</label>
              <input type="text" value={form.libelle} onChange={e => set("libelle", e.target.value)} className={inputCls} placeholder="" />
            </div>
            <div>
              <label className={labelCls}>{requiredDot}Année</label>
              <select value={form.annee} onChange={e => set("annee", e.target.value)} className={inputCls}>
                <option value=""></option>
                {ANNEE_OPTIONS.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
          </div>

          {/* Row 3: Date de constitution + Date de fin */}
          <div className="grid grid-cols-2 gap-6 mb-5">
            <div>
              <label className={labelCls}>Date de constitution</label>
              <div className="relative">
                <input type="text" value={form.dateConstitution} onChange={e => set("dateConstitution", e.target.value)} className={inputCls + " pr-10"} placeholder="JJ/MM/AAAA" />
                <svg className="absolute right-3 top-1/2 -translate-y-1/2 text-[#5C5C5C] pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
            </div>
            <div>
              <label className={labelCls}>Date de fin</label>
              <div className="relative">
                <input type="text" value={form.dateFin} onChange={e => set("dateFin", e.target.value)} className={inputCls + " pr-10"} placeholder="JJ/MM/AAAA" />
                <svg className="absolute right-3 top-1/2 -translate-y-1/2 text-[#5C5C5C] pointer-events-none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </div>
            </div>
          </div>

        </div>

        {/* Footer */}
        <div className="flex items-center justify-center gap-4 px-8 py-5 border-t border-[#E5E5E5]">
          <button onClick={onClose} className="px-6 h-9 border border-[#5C5C5C] rounded text-[14px] text-[#03234D] bg-white hover:bg-[#F3F3F3]">Annuler</button>
          <button
            onClick={handleSave}
            disabled={!canSave}
            className={`px-6 h-9 rounded text-[14px] text-white ${canSave ? "bg-[#8B1A1A] hover:bg-[#6F1515] cursor-pointer" : "bg-[#C9C9C9] cursor-not-allowed"}`}
          >
            Enregistrer
          </button>
        </div>
      </div>
    </div>
  );
}

      {showNewModal && (
        <NouveauGroupeModal
          onClose={() => setShowNewModal(false)}
          onSave={handleSaveGroupe}

  );
}

function AddStagiairesModal({ onClose, onAdd, excludeIds, mode = "stagiaire" }) {
  const isCtr = mode === "controleur";
  const pool = isCtr ? EC_POOL : INDIVIDUS_POOL;
  const modalTitle = isCtr
    ? "Recherche d'un expert-comptable (contrôleur)"
    : "Recherche d'un stagiaire / mémorialiste / diplômé non inscrit";
  const modalSubtitle = isCtr
    ? "Sélectionnez le contrôleur à assigner au groupe"
    : "Sélectionnez les stagiaires à ajouter au groupe";

  const [search, setSearch] = useState("");
  const [selected, setSelected] = useState({});

  // Filter out already-excluded and apply search
  const filtered = pool.filter(ind => {
    if (excludeIds && excludeIds.includes(ind.numInscription)) return false;
    if (!search) return true;
    const q = search.toLowerCase();
    return (
      ind.nom.toLowerCase().includes(q) ||
      ind.prenom.toLowerCase().includes(q) ||
      ind.ville.toLowerCase().includes(q) ||
      ind.numInscription.toLowerCase().includes(q) ||
      ind.departement.toLowerCase().includes(q)
    );
  });

  const selectedCount = Object.values(selected).filter(Boolean).length;
  const toggleAll = () => {
    if (isCtr) return; // no select-all in contrôleur mode
    if (selectedCount === filtered.length) {
      setSelected({});
    } else {
      const next = {};
      filtered.forEach(ind => { next[ind.numInscription] = true; });
      setSelected(next);
    }
  };
  const toggle = (id) => {
    if (isCtr) {
      // Single-select: only one at a time
      setSelected(prev => prev[id] ? {} : { [id]: true });
    } else {
      setSelected(prev => ({ ...prev, [id]: !prev[id] }));
    }
  };

  const handleAdd = () => {
    const toAdd = pool.filter(ind => selected[ind.numInscription]);
    if (toAdd.length > 0) onAdd(toAdd);
  };

  const thCls = "px-2 py-2 text-left text-[12px] font-semibold text-[#03234D] leading-[16px] whitespace-nowrap";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center" style={{ background: "rgba(0,0,0,0.45)" }}>
      <div className="bg-white rounded-lg shadow-2xl flex flex-col" style={{ width: 960, maxHeight: "85vh" }}>
        {/* Header */}
        <div className="flex items-start gap-3 px-6 pt-5 pb-3">
          <div className="w-10 h-10 rounded-full bg-[#D1242F] flex items-center justify-center shrink-0">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div className="flex-1 min-w-0">
            <p className="text-[16px] font-semibold text-[#03234D] leading-[22px]">{modalTitle}</p>
            <p className="text-[13px] text-[#5C5C5C] leading-[18px]">{modalSubtitle}</p>
          </div>
          <button onClick={onClose} className="w-6 h-6 flex items-center justify-center text-[#5C5C5C] hover:text-[#03234D]">
            <XIcon size={16} />
          </button>
        </div>

        {/* Search bar */}
        <div className="flex items-center gap-3 px-6 pb-3">
          <div className="flex items-center flex-1 border border-[#C9C9C9] rounded px-3 h-9">
            <Search size={14} className="text-[#5C5C5C] mr-2 shrink-0" />
            <input
              type="text"
              placeholder="Rechercher par nom, ville..."
              className="flex-1 text-[13px] outline-none bg-transparent"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
          </div>
          <span className="text-[13px] text-[#5C5C5C] whitespace-nowrap">{filtered.length} résultat(s)</span>
        </div>

        {/* Table */}
        <div className="flex-1 overflow-auto px-6">
          <table className="w-full border-collapse text-[13px]">
            <thead className="sticky top-0 z-10">
              <tr className="bg-[#F3F3F3] border-b border-[#C9C9C9]">
                <th className="w-[36px] px-2 py-2">
                  {isCtr ? null : <input type="checkbox" className="w-4 h-4 accent-[#0250D9]" checked={selectedCount === filtered.length && filtered.length > 0} onChange={toggleAll} />}
                </th>
                <th className={thCls}>N° Inscription</th>
                <th className={thCls}>Prénom</th>
                <th className={thCls}>Nom</th>
                <th className={thCls} style={{width:"60px"}}>Qualité</th>
                <th className={thCls}>Statut</th>
                <th className={thCls}>Date Naiss.</th>
                <th className={thCls}>Ville d'exercice</th>
                <th className={thCls} style={{width:"40px"}}>Dép</th>
                <th className={thCls}>Département</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((ind, i) => {
                const checked = !!selected[ind.numInscription];
                return (
                  <tr key={ind.numInscription}
                    className={`border-b border-[#E5E5E5] cursor-pointer transition-colors ${checked ? "bg-[#EEF4FF]" : "hover:bg-[#F9F9F9]"}`}
                    onClick={() => toggle(ind.numInscription)}
                  >
                    <td className="px-2 py-1.5"><input type={isCtr ? "radio" : "checkbox"} name={isCtr ? "ctr-select" : undefined} className="w-4 h-4 accent-[#0250D9]" checked={checked} readOnly /></td>
                    <td className="px-2 py-1.5 text-[#2E2E2E]">{ind.numInscription}</td>
                    <td className="px-2 py-1.5 text-[#2E2E2E]">{ind.prenom}</td>
                    <td className="px-2 py-1.5 font-semibold text-[#03234D]">{ind.nom}</td>
                    <td className="px-2 py-1.5 text-[#2E2E2E]">{ind.qualite}</td>
                    <td className="px-2 py-1.5 text-[#2E2E2E]">{ind.statut}</td>

                    <td className="px-2 py-1.5 text-[#2E2E2E]">{ind.departement}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Footer */}
        <div className="flex items-center justify-between px-6 py-4 border-t border-[#E5E5E5]">
          <span className="text-[13px] text-[#5C5C5C]">Affichage individu 1 – {filtered.length} sur {filtered.length}</span>
          <div className="flex items-center gap-3">
            <button onClick={onClose} className="px-4 h-8 border border-[#5C5C5C] rounded-full text-[14px] text-[#03234D] bg-white">Fermer</button>
            <button
              onClick={handleAdd}
              disabled={selectedCount === 0}
              className={`px-4 h-8 rounded-full text-[14px] text-white ${selectedCount > 0 ? "bg-[#0250D9] hover:bg-[#013DA6] cursor-pointer" : "bg-[#C9C9C9] cursor-not-allowed"}`}
            >
              {isCtr ? (selectedCount > 0 ? "Assigner le contrôleur" : "Assigner le contrôleur") : `Ajouter la sélection${selectedCount > 0 ? ` (${selectedCount})` : ""}`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function GroupeRecordPage({ groupe, onNavigateToRecord }) {
  const [activeTab, setActiveTab] = useState("stagiaires");
  const [showAddModal, setShowAddModal] = useState(false);
  const [addedStagiaires, setAddedStagiaires] = useState([]);

  // Contrôleur management
  const [showControleurModal, setShowControleurModal] = useState(false);
  const [showClotureModal, setShowClotureModal] = useState(false);
  const [controleurHistory, setControleurHistory] = useState(() => {
    // Initialize from groupe.controleur if one exists
    if (groupe.controleur) {
      return [{
        numInscription: groupe.numero + "-CTR-01",
        controleur: groupe.controleur,
        statut: "En exercice",
        dateEffet: groupe.dateConstitution,
        dateFin: "",
      }];
    }
    return [];
  });

  const activeControleur = controleurHistory.find(c => c.statut === "En exercice");
  const hasActiveControleur = !!activeControleur;

  // Find stagiaires belonging to this groupe + manually added ones
  const groupeStagiaires = [
    ...STAGIAIRES_LIST.filter(s => s.groupePrincipal === groupe.numero),
    ...addedStagiaires,
  ];

  // IDs to exclude from the modal (already in the group)
  const excludeIds = groupeStagiaires.map(s => s.numInscription);

  const handleAddStagiaires = (individus) => {
    // Convert individus to stagiaire format and add them
    const newStagiaires = individus.map(ind => ({
      cr: ind.departement,
      numInscription: ind.numInscription,
      groupePrincipal: groupe.numero,
      stagiaire: ind.nom + " " + ind.prenom,
      statut: "En exercice",
      dscg: "Complet",
      cursusFormation: "1",
      dateEffet: groupe.dateConstitution,
      dateFin: "",
      anneeStage: groupe.annee,
    }));
    setAddedStagiaires(prev => [...prev, ...newStagiaires]);
    setShowAddModal(false);
  };

  // Contrôleur: handle "Ajouter contrôleur" button click
  const handleControleurButtonClick = () => {
    if (hasActiveControleur) {
      // Must close current before adding new → show clôture modal
      setShowClotureModal(true);
    } else {
      // No active → directly open search modal
      setShowControleurModal(true);
    }
  };

  // Contrôleur: after setting date de fin on current, open search modal
  const handleClotureConfirm = (dateFin) => {
    setControleurHistory(prev => prev.map(c =>
      c.statut === "En exercice" ? { ...c, statut: "Terminé", dateFin } : c
    ));
    setShowClotureModal(false);
    setShowControleurModal(true);
  };

  // Contrôleur: assign new from search modal
  const handleAddControleur = (individus) => {
    const ind = individus[0]; // single select
    const ctrIndex = controleurHistory.length + 1;
    const newCtr = {
      numInscription: groupe.numero + "-CTR-" + String(ctrIndex).padStart(2, "0"),
      controleur: ind.nom + " " + ind.prenom,
      statut: "En exercice",
      dateEffet: new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }),
      dateFin: "",
    };
    setControleurHistory(prev => [...prev, newCtr]);
    setShowControleurModal(false);
  };

  // ── Suppression stagiaire ──
  const [deleteConfirm, setDeleteConfirm] = useState(null); // { type: "stagiaire"|"controleur", target }
  const [removedOriginals, setRemovedOriginals] = useState([]); // numInscription of original stagiaires removed

  const handleDeleteStagiaire = (s) => {
    setDeleteConfirm({
      type: "stagiaire",
      target: s,
      title: "Retirer le stagiaire",
      message: `Êtes-vous sûr de vouloir retirer ${s.stagiaire} de ce groupe ?`,
    });
  };

  const handleDeleteControleur = (ctr) => {
    if (ctr.statut === "En exercice") {
      // Active: must set date de fin first → show clôture modal then remove
      setDeleteConfirm({
        type: "controleur-actif",
        target: ctr,
        title: "Retirer le contrôleur actif",
        message: `${ctr.controleur} est actuellement actif. Souhaitez-vous le retirer et mettre fin à sa mission ?`,
      });
    } else {
      // Terminé: simple removal from history
      setDeleteConfirm({
        type: "controleur",
        target: ctr,
        title: "Supprimer de l'historique",
        message: `Êtes-vous sûr de vouloir supprimer ${ctr.controleur} de l'historique des contrôleurs ?`,
      });
    }
  };

  const confirmDelete = () => {
    if (!deleteConfirm) return;
    const { type, target } = deleteConfirm;
    if (type === "stagiaire") {
      // Check if it's from addedStagiaires or from original list
      const isAdded = addedStagiaires.some(s => s.numInscription === target.numInscription);
      if (isAdded) {
        setAddedStagiaires(prev => prev.filter(s => s.numInscription !== target.numInscription));
      } else {
        setRemovedOriginals(prev => [...prev, target.numInscription]);
      }
    } else if (type === "controleur") {
      setControleurHistory(prev => prev.filter(c => c.numInscription !== target.numInscription));
    } else if (type === "controleur-actif") {
      // Set today as date de fin and mark as Terminé (remove from active)
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, "0");
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const yyyy = today.getFullYear();
      setControleurHistory(prev => prev.map(c =>
        c.numInscription === target.numInscription
          ? { ...c, statut: "Terminé", dateFin: `${dd}/${mm}/${yyyy}` }
          : c
      ));
    }
    setDeleteConfirm(null);
  };

  // Filter out removed originals from groupeStagiaires
  const visibleStagiaires = groupeStagiaires.filter(s => !removedOriginals.includes(s.numInscription));

  return (
    <>
      {/* Page Header */}
      <div className="bg-[#F3F3F3] px-4 py-4">

];
const CONTACT_TABS_MORE = [
  { key: "declarations",  label: "Déclarations"     },

];
const CONTACT_TABS = [...CONTACT_TABS_VISIBLE, ...CONTACT_TABS_MORE];

function ContactTabBar({ activeTab, onTabChange }) {
  const [moreOpen, setMoreOpen] = React.useState(false);
  const moreRef = React.useRef(null);
  const btnRef = React.useRef(null);
  const [dropPos, setDropPos] = React.useState({ top: 0, left: 0 });
  const activeInMore = CONTACT_TABS_MORE.some(t => t.key === activeTab);

  const openMenu = () => {
    if (btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setDropPos({ top: r.bottom + 2, left: r.left });
    }
    setMoreOpen(o => !o);
  };

  React.useEffect(() => {
    if (!moreOpen) return;
    const handleClick = (e) => {
      if (moreRef.current && !moreRef.current.contains(e.target)) setMoreOpen(false);
    };
    document.addEventListener("mousedown", handleClick);
    return () => document.removeEventListener("mousedown", handleClick);
  }, [moreOpen]);

  return (
    <div className="flex w-full" ref={moreRef}>
      <div className="flex overflow-x-auto">
        {CONTACT_TABS_VISIBLE.map((tab) => (
          <button
            key={tab.key}
            onClick={() => onTabChange(tab.key)}
            className={`px-3 h-10 text-[14px] font-semibold whitespace-nowrap ${
              activeTab === tab.key
                ? "text-[#0250D9] border-b-[3px] border-[#0250D9]"
                : "text-[#5C5C5C] border-b border-[#C9C9C9]"
            }`}
          >
            {tab.label}
          </button>
        ))}
      </div>
      {/* "Plus" — position:fixed pour échapper à tout overflow parent */}
      <div className="shrink-0">
        <button
          ref={btnRef}
          onClick={openMenu}
          className={`px-3 h-10 text-[14px] font-semibold whitespace-nowrap flex items-center gap-1 ${
            activeInMore
              ? "text-[#0250D9] border-b-[3px] border-[#0250D9]"
              : "text-[#5C5C5C] border-b border-[#C9C9C9]"
          }`}
        >
          Plus
          <ChevronDown size={14} />
        </button>
        {moreOpen && (
          <div style={{position:"fixed", top:dropPos.top, left:dropPos.left, zIndex:9999, background:"white", border:"1px solid #C9C9C9", borderRadius:6, boxShadow:"0 4px 16px rgba(0,0,0,0.12)", minWidth:190}}>
            {CONTACT_TABS_MORE.map((tab) => (
              <button
                key={tab.key}
                onClick={() => { onTabChange(tab.key); setMoreOpen(false); }}
                style={{display:"block", width:"100%", textAlign:"left", padding:"8px 16px", fontSize:13, background:"none", border:"none", cursor:"pointer", color: activeTab === tab.key ? "#0250D9" : "#03234D", fontWeight: activeTab === tab.key ? 600 : 400}}
                onMouseEnter={e => e.currentTarget.style.background="#F3F3F3"}
                onMouseLeave={e => e.currentTarget.style.background="none"}
              >
                {tab.label}
              </button>
            ))}
          </div>
        )}
      </div>
      <div className="flex-1 border-b border-[#C9C9C9]" />
    </div>
  );
}

function buildContactData(demande) {
  // Qualité selon le profil du demandeur
  const qualiteMap = {
    "Article 27": "EXPERT-COMPTABLE",
    "Article 7bis": "EXPERT-COMPTABLE",
    "Article 83 bis": "COMMISSAIRE AUX COMPTES",
    "Expert-comptable en entreprise": "EXPERT-COMPTABLE SALARIÉ",
    "Diplômé d'expertise comptable": "EXPERT-COMPTABLE",
  };
  const qualite = qualiteMap[demande.profil] || "EXPERT-COMPTABLE";
  // N° Supra déterministe à partir du num de demande
  const seed = parseInt(demande.num.replace(/\D/g, ""), 10) || 999;
  const supraSuffix = String(seed % 100000000).padStart(8, "0");
  const supraRegion = seed % 15 + 1;
  const numSupra = `${supraRegion < 10 ? "0" : ""}${supraRegion} ${supraSuffix.slice(0, 4)}${supraSuffix.slice(4)} 01`;
  // CRO
  const regions = ["Île-de-France","Hauts-de-France","Grand-Est","Normandie","Bretagne","Auvergne-Rhône-Alpes","Pays de la Loire","Occitanie","Nouvelle Aquitaine"];
  const cro = regions[seed % regions.length];
  // Date d'inscription
  const yr = 2000 + (seed % 20);
  const mo = String((seed % 12) + 1).padStart(2,"0");
  const dy = String((seed % 28) + 1).padStart(2,"0");
  const dateInscription = `${dy}/${mo}/${yr}`;
  // Derive nom/prénom — format données "Prénom NOM" → dernier mot = NOM
  const parts = demande.demandeur.trim().split(" ");
  const nom = parts[parts.length - 1] || demande.demandeur;
  const prenom = parts.slice(0, parts.length - 1).join(" ") || "";
  // Generated email & phone (déterministes, non vides)
  const emailDomains = ["orange.fr","gmail.com","free.fr","wanadoo.fr","sfr.fr","outlook.fr"];
  const generatedEmail = `${prenom.toLowerCase().replace(/[^a-z]/g,"")}.${nom.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z-]/g,"")}@${emailDomains[seed % emailDomains.length]}`;
  const phonePrefixes = ["01","06","07","09","04","05","03","02"];
  const phoneBase = String(10000000 + (seed * 137) % 89999999);
  const generatedPhone = `+33 ${phonePrefixes[seed % phonePrefixes.length]} ${phoneBase.slice(0,2)} ${phoneBase.slice(2,4)} ${phoneBase.slice(4,6)} ${phoneBase.slice(6,8)}`;

  const highlights = [
    { label: "Qualité",                 value: qualite },
    { label: "Numéro d'inscription",    value: numSupra },
    { label: "Statut",                  value: "En exercice" },
    { label: "Adresse pro", value: "3 AVENUE FOCH 06000 NICE FRANCE", isAccountLink: true },
    { label: "Type d'inscription",      value: "Principal" },
    { label: "Date d'inscription",      value: dateInscription },
    { label: "CRO",                     value: cro },
    { label: "Email pro",               value: generatedEmail },
    { label: "Portable",                value: generatedPhone },
  ];

  // ── Section Identité ──────────────────────────────────────────
  const identiteFields = [
    [{ label: "Nom du contact",         value: `${nom.toUpperCase()} ${prenom.charAt(0).toUpperCase()}${prenom.slice(1).toLowerCase()}`, readOnly: true  }, { label: "Qualité",               value: qualite,       readOnly: true  }],
    [{ label: "N° Supra",               value: numSupra,          readOnly: true  }, { label: "Statut",                value: "En exercice", readOnly: true  }],
    [{ label: "Entrepreneur Individuel",value: seed % 2 === 0 ? "OUI" : "NON", readOnly: true }, { label: "Type d'inscription", value: "Principal", readOnly: true }],
    [{ label: "Date d'inscription",     value: dateInscription,   readOnly: true  }, { label: "CRO",                   value: cro,           readOnly: true  }],
    [{ label: "Email",                  value: generatedEmail                      }, { label: "Téléphone",             value: generatedPhone                 }],
    [{ label: "Mobile",                 value: ""                                  }],
  ];

  // ── Section Dossier ───────────────────────────────────────────
  const numInscRegion = String(supraRegion < 10 ? "0" + supraRegion : supraRegion);
  const dossierFields = [
    [{ label: "Adresse pro.",        value: `${numSupra} ${demande.demandeur}`, readOnly: true }, { label: "N° Inscription",     value: `${numInscRegion} | ${supraSuffix} | 01`                                }],
    [{ label: "Type d'inscription",  value: "PRINCIPAL",               readOnly: true  }, { label: "Statut",             value: "EN EXERCICE",                 readOnly: true  }],
    [{ label: "Conseil Régional",    value: cro,                        readOnly: true  }, { label: "Activité BNC",       value: "Oui",                         readOnly: true  }],
    [{ label: "Adresse Ordinale",    value: "Adresse personnelle",      readOnly: true  }, { label: "Contrôleur de stage",value: ""                                             }],
    [{ label: "E-mail",              value: ""                                           }, { label: "Diffusion adresse",  value: "Oui"                                          }],
    [{ label: "Mobile",              value: ""                                           }, { label: "EIRL",               value: ""                                             }],
    [{ label: "Téléphone",           value: ""                                           }, { label: "Fax",                value: ""                                             }],
    [{ label: "Site internet",       value: ""                                           }],
  ];

  // ── Section Cotisations ───────────────────────────────────────
  const cotisationsFields = [
    [{ label: "Solde cotisation",           value: "",                       readOnly: true }, { label: "Dernière année de cotisation", value: String(new Date().getFullYear() - 1), readOnly: true }],
  ];

  // ── Section Coordonnées priorisées ────────────────────────────
  const coordonneesFields = [
    [{ label: "Téléphone",  value: "(Tél. fixe prof.)",  readOnly: true }, { label: "Fax",   value: "", readOnly: true }],
    [{ label: "Email",      value: "(E-mail prof.)",     readOnly: true }],
  ];

  // ── Section Comptexpert ───────────────────────────────────────
  const loginSeed = nom.toLowerCase().replace(/\s/g,"").slice(0,1) + prenom.toLowerCase().replace(/\s/g,"").slice(0,6);
  const comptexpertFields = [
    [{ label: "Login",  value: loginSeed,  readOnly: true }, { label: "E-mail", value: "", readOnly: true }],
    [{ label: "Statut", value: "Actif",    readOnly: true }],
  ];

  // ── Section Adresses ─────────────────────────────────────────
  const addrStreets = ["RUE DE LA PAIX","AVENUE DU GÉNÉRAL DE GAULLE","BOULEVARD HAUSSMANN","RUE DU FAUBOURG SAINT-HONORÉ","ALLÉE DES ROSES","RUE NATIONALE","AVENUE FOCH","RUE DE RIVOLI"];
  const addrCities  = [{cp:"75008",ville:"PARIS"},{cp:"69001",ville:"LYON"},{cp:"13001",ville:"MARSEILLE"},{cp:"31000",ville:"TOULOUSE"},{cp:"33000",ville:"BORDEAUX"},{cp:"06000",ville:"NICE"},{cp:"59000",ville:"LILLE"},{cp:"67000",ville:"STRASBOURG"}];
  const addrNumPerso = 5  + (seed * 7)  % 120;

      [{ label: "Site web",  value: "" }],

    coordFields: [
      [{ label: "Téléphone", value: generatedPhone }, { label: "E-mail",   value: generatedEmail }],

  };

  return { highlights, identiteFields, dossierFields, cotisationsFields, coordonneesFields, comptexpertFields, adressePersoData, adresseProData };
